<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a84ff">
<title>Чат</title>
<style>
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, sans-serif; background:#f2f2f7; height:100dvh; display:flex; flex-direction:column; }
  header { background:#0a84ff; color:#fff; padding:14px; font-weight:600; display:flex; align-items:center; gap:10px; }
  header button { background:none; border:none; color:#fff; font-size:20px; }
  .view { display:none; flex:1; flex-direction:column; min-height:0; }
  .view.active { display:flex; }
  .center { justify-content:center; align-items:center; padding:24px; gap:12px; }
  input { font-size:16px; padding:12px; border:1px solid #ccc; border-radius:12px; width:100%; }
  .btn { background:#0a84ff; color:#fff; border:none; border-radius:12px; padding:12px 18px; font-size:16px; }
  .list { flex:1; overflow-y:auto; }
  .room { background:#fff; padding:16px; border-bottom:1px solid #eee; font-size:17px; }
  .msgs { flex:1; overflow-y:auto; padding:12px; display:flex; flex-direction:column; gap:6px; }
  .bubble { max-width:80%; padding:8px 12px; border-radius:16px; background:#fff; align-self:flex-start; word-wrap:break-word; }
  .bubble.mine { background:#0a84ff; color:#fff; align-self:flex-end; }
  .author { font-size:12px; color:#888; }
  .bar { display:flex; gap:8px; padding:8px; background:#fff; }
</style>
</head>
<body>

<div id="vName" class="view center">
  <h2>Как вас зовут?</h2>
  <input id="nameInput" placeholder="Имя" maxlength="20">
  <button class="btn" id="nameBtn">Продолжить</button>
</div>

<div id="vRooms" class="view">
  <header>Чаты <span style="flex:1"></span><button id="newRoom">＋</button></header>
  <div id="roomList" class="list"></div>
</div>

<div id="vChat" class="view">
  <header><button id="back">←</button><span id="roomTitle"></span></header>
  <div id="msgs" class="msgs"></div>
  <div class="bar">
    <input id="msgInput" placeholder="Сообщение..." autocomplete="off">
    <button class="btn" id="sendBtn">➤</button>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, collection, addDoc, query, orderBy, limit, onSnapshot, serverTimestamp }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBFZH_-XzfXCVItFF0PXd2GBaI5_LRWCko",
  authDomain: "buldog-5fef9.firebaseapp.com",
  projectId: "buldog-5fef9"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const $ = (id) => document.getElementById(id);
let user = null, name = localStorage.getItem("name") || "";
let unsubMsgs = null, currentRoom = null;

function show(id) {
  document.querySelectorAll(".view").forEach(v => v.classList.remove("active"));
  $(id).classList.add("active");
}

onAuthStateChanged(auth, (u) => {
  if (u) { user = u; start(); }
  else signInAnonymously(auth).catch(e => alert("Ошибка входа: " + e.message));
});

function start() {
  if (!name) show("vName");
  else { show("vRooms"); loadRooms(); }
}

$("nameBtn").onclick = () => {
  const n = $("nameInput").value.trim();
  if (!n) return;
  name = n; localStorage.setItem("name", n);
  start();
};

let roomsLoaded = false;
function loadRooms() {
  if (roomsLoaded) return;
  roomsLoaded = true;
  const q = query(collection(db, "rooms"), orderBy("createdAt", "desc"), limit(100));
  onSnapshot(q, (snap) => {
    const list = $("roomList");
    list.innerHTML = "";
    snap.forEach(d => {
      const div = document.createElement("div");
      div.className = "room";
      div.textContent = "💬 " + d.data().name;
      div.onclick = () => openRoom(d.id, d.data().name);
      list.appendChild(div);
    });
    if (snap.empty) list.innerHTML = '<p style="padding:20px;color:#888">Чатов пока нет. Нажмите ＋</p>';
  }, (e) => alert("Ошибка: " + e.message));
}

$("newRoom").onclick = async () => {
  const n = prompt("Название чата:");
  if (!n || !n.trim()) return;
  await addDoc(collection(db, "rooms"), {
    name: n.trim().slice(0, 40), createdBy: user.uid, createdAt: serverTimestamp()
  });
};

function openRoom(id, title) {
  currentRoom = id;
  $("roomTitle").textContent = title;
  $("msgs").innerHTML = "";
  show("vChat");
  if (unsubMsgs) unsubMsgs();
  const q = query(collection(db, "rooms", id, "messages"), orderBy("createdAt", "desc"), limit(100));
  unsubMsgs = onSnapshot(q, (snap) => {
    const box = $("msgs");
    box.innerHTML = "";
    snap.docs.reverse().forEach(d => {
      const m = d.data();
      const mine = m.uid === user.uid;
      const b = document.createElement("div");
      b.className = "bubble" + (mine ? " mine" : "");
      if (!mine) {
        const a = document.createElement("div");
        a.className = "author"; a.textContent = m.name;
        b.appendChild(a);
      }
      const t = document.createElement("div");
      t.textContent = m.text;
      b.appendChild(t);
      box.appendChild(b);
    });
    box.scrollTop = box.scrollHeight;
  });
}

$("back").onclick = () => {
  if (unsubMsgs) unsubMsgs();
  unsubMsgs = null; currentRoom = null;
  show("vRooms");
};

async function send() {
  const text = $("msgInput").value.trim();
  if (!text || !currentRoom) return;
  $("msgInput").value = "";
  await addDoc(collection(db, "rooms", currentRoom, "messages"), {
    text, uid: user.uid, name, createdAt: serverTimestamp()
  });
}
$("sendBtn").onclick = send;
$("msgInput").addEventListener("keydown", e => { if (e.key === "Enter") send(); });
</script>
</body>
</html>
