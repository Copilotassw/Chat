<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover,interactive-widget=resizes-content">
<title>ClaudeMAX</title>
<meta name="theme-color" content="#101015">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
html,body{height:100%;overflow:hidden;background:#101015;color:#f2f2f5}
body{position:fixed;inset:0;-webkit-user-select:none;user-select:none}
input,textarea,select{-webkit-user-select:text;user-select:text;font-size:16px;color:#fff}
button{border:0;background:none;color:inherit;cursor:pointer;font-size:inherit}
:root{--acc:#d97757;--hh:calc(64px + env(safe-area-inset-top));--nh:calc(64px + env(safe-area-inset-bottom));--mut:#9c9cab}

/* фон */
.bg{position:fixed;inset:0;z-index:0;overflow:hidden;background:#101015}
.bg i{position:absolute;border-radius:50%;will-change:transform}
.s1{width:320px;height:320px;top:-70px;left:-80px;background:radial-gradient(circle at 30% 30%,#ffa27d,#d97757 55%,#9c3f25);animation:d1 18s ease-in-out infinite alternate}
.s2{width:360px;height:360px;bottom:-110px;right:-110px;background:radial-gradient(circle at 30% 30%,#9a9bff,#5a5ad8 60%,#2b2b8c);animation:d2 22s ease-in-out infinite alternate}
.s3{width:210px;height:210px;top:42%;left:52%;background:radial-gradient(circle at 30% 30%,#6ff2dc,#0fb0a4 60%,#05605b);animation:d1 26s ease-in-out infinite alternate-reverse}
.bg::after{content:"";position:absolute;inset:0;background:rgba(12,12,17,.42)}
@keyframes d1{to{transform:translate(50px,70px)}}
@keyframes d2{to{transform:translate(-60px,-50px)}}

.glass{background:rgba(22,22,30,.55);-webkit-backdrop-filter:blur(22px) saturate(170%);backdrop-filter:blur(22px) saturate(170%);border:1px solid rgba(255,255,255,.12)}
.ic{width:24px;height:24px;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.ic.fill{fill:#fff}.ic.mut{stroke:var(--mut);width:20px;height:20px}.ic.acc{stroke:var(--acc)}
.hang{transform:rotate(135deg)}
.ib{width:40px;height:40px;display:grid;place-items:center;flex-shrink:0;border-radius:50%;cursor:pointer}
.ib:active{background:rgba(255,255,255,.14)}
.hb{width:46px;height:46px;border-radius:50%;background:rgba(255,255,255,.1);display:grid;place-items:center;flex-shrink:0}
.hb.acc{background:var(--acc)}
.hb:active{opacity:.7}

#app{position:fixed;inset:0;z-index:1}
.view{position:absolute;inset:0;display:none;flex-direction:column}
.view.on{display:flex;animation:vin .2s ease-out}
@keyframes vin{from{opacity:.4;transform:translateY(10px)}to{opacity:1;transform:none}}
.hd{position:absolute;top:0;left:0;right:0;height:var(--hh);padding:env(safe-area-inset-top) 12px 0 16px;display:flex;align-items:center;gap:8px;z-index:5;border-width:0 0 1px 0}
.hd h1{font-size:28px;font-weight:800;flex:1}
.nav{position:absolute;bottom:0;left:0;right:0;height:var(--nh);padding-bottom:env(safe-area-inset-bottom);display:flex;z-index:5;border-width:1px 0 0 0}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11.5px;color:var(--mut)}
.nav button.on{color:var(--acc)}
.nav button.on .ic{stroke:var(--acc)}
.scroll{position:absolute;inset:0;overflow-y:auto;overscroll-behavior:contain;padding:calc(var(--hh) + 10px) 14px calc(var(--nh) + 16px)}

/* splash */
#splash,#welcome{position:fixed;inset:0;z-index:900;background:#0b0b10;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:30px;transition:opacity .45s}
#splash.off,#welcome.off{opacity:0;pointer-events:none}
#welcome{display:none;z-index:800}#welcome.on{display:flex}
.spin{animation:spin 9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.sp-title{font-size:30px;font-weight:800;margin-top:18px}
.sp-tip{height:44px;margin-top:26px;display:flex;align-items:center;text-align:center;color:var(--mut);font-size:14px;max-width:290px}
.sp-tip span{animation:fi .4s}
.sp-bar{width:150px;height:4px;border-radius:4px;background:rgba(255,255,255,.12);margin-top:14px;overflow:hidden}
.sp-bar i{display:block;height:100%;background:var(--acc);animation:ld 2.2s ease-out forwards}
@keyframes ld{from{width:0}to{width:100%}}
@keyframes fi{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.ray{stroke-dasharray:1;stroke-dashoffset:1;animation:ray .45s ease-out forwards;animation-delay:calc(var(--i)*70ms)}
@keyframes ray{to{stroke-dashoffset:0}}
.wl-hi{font-size:30px;font-weight:800;margin-top:22px;animation:fi .5s .9s both;text-align:center}
.wl-sub{color:var(--mut);margin-top:6px;animation:fi .5s 1.1s both}

/* язык */
.lang{position:relative;display:inline-flex;background:#fff;border-radius:999px;padding:3px;cursor:pointer;flex-shrink:0}
.lang i{position:absolute;top:3px;bottom:3px;left:3px;width:calc(50% - 3px);background:#111;border-radius:999px;transition:transform .25s}
.lang.en i{transform:translateX(100%)}
.lang b{position:relative;z-index:1;min-width:42px;text-align:center;padding:5px 0;font-size:12px;font-weight:800;color:#666;transition:color .25s}
.lang b.on{color:#fff}

/* auth */
#v-auth{align-items:center;justify-content:center;padding:20px;overflow-y:auto}
.au-top{position:absolute;top:calc(14px + env(safe-area-inset-top));right:14px}
.au-head{text-align:center;margin-bottom:22px}
.au-head h2{font-size:30px;font-weight:800;margin-top:14px}
.au-head p{color:#d8d8e2;margin-top:4px;font-size:14px}
.au-card{width:100%;max-width:380px;border-radius:28px;padding:20px;box-shadow:0 20px 50px rgba(0,0,0,.4)}
.seg{display:flex;background:rgba(0,0,0,.3);border-radius:14px;padding:3px;margin-bottom:14px}
.seg button{flex:1;padding:10px;border-radius:11px;font-weight:700;font-size:14px;color:var(--mut);transition:.2s}
.seg button.on{background:rgba(255,255,255,.16);color:#fff}
.fld{width:100%;background:rgba(0,0,0,.3);border:1px solid rgba(255,255,255,.14);border-radius:14px;padding:13px 16px;outline:none;margin-bottom:10px;transition:border .2s;display:block}
.fld:focus{border-color:var(--acc)}
.err{color:#ff8a80;font-size:13px;min-height:18px;margin:2px 2px 8px}
.btn{width:100%;background:linear-gradient(135deg,#e2825f,#d06a48);color:#fff;border-radius:14px;padding:14px;font-weight:700;font-size:15px;box-shadow:0 6px 18px rgba(217,119,87,.3);display:block;text-align:center}
.btn:active{transform:scale(.98)}.btn:disabled{opacity:.6}
.btn.ghost{background:rgba(255,255,255,.1);box-shadow:none;margin-top:8px}
.btn.sm{width:auto;padding:9px 16px;font-size:13px;display:inline-block}
.lbl{font-size:11px;color:var(--mut);font-weight:700;letter-spacing:.6px;margin:10px 2px 6px;text-transform:uppercase}

/* список чатов */
.tabs{display:flex;gap:26px;padding:2px 6px 0;border-bottom:1px solid rgba(255,255,255,.07);margin-bottom:6px}
.tabs button{padding:8px 2px 10px;font-size:17px;font-weight:600;color:var(--mut);border-bottom:3px solid transparent}
.tabs button.on{color:var(--acc);border-color:var(--acc)}
.ci{display:flex;align-items:center;gap:13px;padding:10px 6px;border-radius:16px;cursor:pointer}
.ci:active{background:rgba(255,255,255,.08)}
.ci .mid{flex:1;min-width:0}
.ci .nm{font-weight:700;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ci .ls{color:var(--mut);font-size:14px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rc{display:flex;flex-direction:column;align-items:flex-end;gap:6px;align-self:flex-start;margin-top:4px}
.tm{font-size:12px;color:var(--mut)}
.udot{width:12px;height:12px;border-radius:50%;background:var(--acc);display:block}
.av{border-radius:50%;display:grid;place-items:center;font-weight:800;color:#fff;background-size:cover;background-position:center;flex-shrink:0}
.hint{text-align:center;color:var(--mut);padding:26px 20px;font-size:14px}
.row{display:flex;align-items:center;gap:12px;padding:8px 4px;cursor:pointer;border-radius:12px}
.row:active{background:rgba(255,255,255,.08)}
.row .rm{flex:1;min-width:0}
.row .rm b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .rm small{color:var(--mut);font-size:12.5px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.scroll .row{padding:9px 6px}
.badge{font-size:11px;font-weight:700;background:rgba(217,119,87,.25);color:#ffb596;padding:3px 8px;border-radius:10px;white-space:nowrap}

/* звонки */
.cta{display:flex;align-items:center;gap:14px;padding:14px 6px;color:var(--acc);font-size:17px;font-weight:600;cursor:pointer}
.cta .ic{stroke:var(--acc)}
.cinfo{font-size:13.5px;margin-top:3px}
.cinfo.red{color:#ff6b6b}
.cinfo.mut{color:var(--mut)}

/* приложения */
.acts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:8px}
.act{padding:16px 14px;border-radius:18px;background:linear-gradient(135deg,rgba(217,119,87,.38),rgba(124,108,240,.28));border:1px solid rgba(255,255,255,.14);text-align:left;display:flex;flex-direction:column;gap:4px}
.act small{color:#d9d9e3;font-size:12px;line-height:1.3}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tile{display:flex;flex-direction:column;align-items:center;gap:7px;padding:14px 6px;border-radius:18px;background:rgba(32,32,44,.6);border:1px solid rgba(255,255,255,.08);cursor:pointer;min-width:0}
.tile:active{background:rgba(255,255,255,.12)}
.tile .ico{font-size:30px;width:56px;height:56px;display:grid;place-items:center;border-radius:16px;background:rgba(255,255,255,.08)}
.tile b{font-size:13px;text-align:center;width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* настройки */
.pcard{border-radius:24px;overflow:hidden;margin-bottom:14px;background:rgba(32,32,44,.6);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.1)}
.pban{height:100px}
.pav{margin:-44px auto 0;width:88px;height:88px;border-radius:50%;border:3px solid #20202c}
.pbody{padding:12px 18px 18px}
.gc{border-radius:20px;background:rgba(32,32,44,.6);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.08);margin-bottom:14px;overflow:hidden}
.srow{display:flex;align-items:center;gap:14px;padding:15px 16px;cursor:pointer;font-size:16px}
.srow+.srow{border-top:1px solid rgba(255,255,255,.06)}
.srow:active{background:rgba(255,255,255,.06)}
.sw{display:flex;gap:10px;flex-wrap:wrap;margin:4px 0 14px}
.sw i{width:32px;height:32px;border-radius:50%;border:3px solid transparent;cursor:pointer}
.sw i.on{border-color:#fff}

/* комната */
#room-bg{position:absolute;inset:0}
#msgs{position:absolute;inset:0;overflow-y:auto;overscroll-behavior:contain;display:flex;flex-direction:column;padding:calc(var(--hh) + 10px) 12px calc(78px + env(safe-area-inset-bottom))}
#msgs.bt{padding-bottom:calc(128px + env(safe-area-inset-bottom))}
.hd .rt{flex:1;min-width:0;line-height:1.2}
.hd .rt b{font-size:16px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hd .rt small{font-size:12px;color:var(--mut)}
.hd .rt small.on{color:#7ee2a8}
.m{max-width:82%;width:fit-content;padding:8px 12px 5px;border-radius:18px;font-size:15px;line-height:1.35;margin-bottom:6px;white-space:pre-wrap;word-break:break-word;-webkit-user-select:text;user-select:text;animation:pop .18s ease-out}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.96)}to{opacity:1;transform:none}}
.m.in{align-self:flex-start;background:rgba(30,30,42,.62);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.1);border-bottom-left-radius:5px}
.m.out{align-self:flex-end;background:linear-gradient(135deg,#e2825f,#d06a48);border-bottom-right-radius:5px}
.m .who{font-size:12px;font-weight:700;color:#ffb596;margin-bottom:2px}
.m .tm{font-size:10.5px;opacity:.65;text-align:right;margin-top:2px;color:inherit}
.m img{max-width:100%;max-height:300px;border-radius:12px;display:block;margin:2px 0;cursor:pointer}
.m video{width:260px;max-width:100%;max-height:320px;border-radius:12px;display:block;margin:2px 0;background:#000}
.appbtn{display:block;margin:8px 0 2px;padding:10px 14px;border-radius:12px;background:rgba(255,255,255,.14);font-weight:700;font-size:14px;width:100%}
.voice{display:flex;align-items:center;gap:10px;min-width:210px;padding:2px 0}
.vp{width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.22);display:grid;place-items:center;flex-shrink:0}
.vmid{flex:1}
.vbar{height:4px;border-radius:3px;background:rgba(255,255,255,.28);overflow:hidden}
.vbar i{display:block;height:100%;width:0;background:#fff}
.vt{font-size:11px;opacity:.85;margin-top:5px;display:block}
#chips{position:absolute;left:0;right:0;bottom:calc(76px + env(safe-area-inset-bottom));display:none;gap:8px;padding:0 12px;overflow-x:auto;z-index:4}
.chip{padding:9px 15px;border-radius:18px;background:rgba(40,40,56,.78);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.16);font-size:14px;white-space:nowrap;flex-shrink:0}
.bar{position:absolute;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom));min-height:56px;border-radius:28px;z-index:5;padding:6px;transition:border-color .2s}
.bar-n,.bar-r{display:flex;align-items:center;gap:6px}
.bar-r{display:none}
.bar.rec{border-color:rgba(255,90,90,.6)}
.bar.rec .bar-n{display:none}.bar.rec .bar-r{display:flex}
.bar .inp{flex:1;min-width:0;background:rgba(255,255,255,.08);border:0;border-radius:22px;padding:11px 16px;outline:none}
.send{width:42px;height:42px;border-radius:50%;background:var(--acc);display:grid;place-items:center;flex-shrink:0}
.send:active{transform:scale(.92)}
.bar:not(.txt) #sendb{display:none}
.bar.txt #mic{display:none}
.bar.bot #attach,.bar.bot #mic{display:none}
.bar.bot #sendb{display:grid}
.rec-info{flex:1;min-width:0;padding:0 6px}
.rec-l1{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:700;color:#ff8a80}
.rdot{width:10px;height:10px;border-radius:50%;background:#ff4d4d;animation:rd 1s infinite}
@keyframes rd{50%{opacity:.25;transform:scale(.7)}}
.rec-l2{display:flex;align-items:center;gap:10px;margin-top:3px}
.rec-l2 b{font-variant-numeric:tabular-nums;font-size:15px;min-width:38px}
.wave{display:flex;align-items:center;gap:3px;height:22px;flex:1;overflow:hidden}
.wave u{width:3px;height:100%;background:#ff6b6b;border-radius:2px;animation:wv .9s ease-in-out infinite}
.wave u:nth-child(3n){animation-delay:-.3s}.wave u:nth-child(3n+1){animation-delay:-.6s}.wave u:nth-child(5n){animation-delay:-.15s}
@keyframes wv{0%,100%{transform:scaleY(.2)}50%{transform:scaleY(1)}}

/* sheet */
.ov{position:fixed;inset:0;z-index:700;display:none;background:rgba(0,0,0,.5);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.ov.on{display:flex}
#sheet{align-items:flex-end}
.sh-box{width:100%;max-height:88vh;overflow-y:auto;border-radius:26px 26px 0 0;padding:10px 18px calc(20px + env(safe-area-inset-bottom));animation:up .25s ease-out;background:rgba(26,26,36,.78);-webkit-backdrop-filter:blur(26px);backdrop-filter:blur(26px);border:1px solid rgba(255,255,255,.12)}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
.grab{width:42px;height:4px;border-radius:3px;background:rgba(255,255,255,.3);margin:0 auto 14px}
.sh-box h3{font-size:18px;margin-bottom:12px}
.walls{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px}
.walls i{height:64px;border-radius:14px;border:3px solid transparent;cursor:pointer}
.walls i.on{border-color:#fff}
.crow{display:flex;gap:6px;margin-bottom:8px}
.crow input{margin:0}
#viewer{align-items:center;justify-content:center;background:rgba(0,0,0,.88)}
#viewer img{max-width:100%;max-height:100%}
#toast{position:fixed;top:calc(14px + env(safe-area-inset-top));left:50%;transform:translate(-50%,-110px);z-index:999;padding:11px 18px;border-radius:20px;font-size:14px;max-width:88%;text-align:center;transition:transform .3s}
#toast.on{transform:translate(-50%,0)}

/* мини-приложение */
#appv{position:fixed;inset:0;z-index:720;background:#0f0f14;display:none;flex-direction:column}
#appv.on{display:flex}
.ahd{height:calc(54px + env(safe-area-inset-top));padding:env(safe-area-inset-top) 10px 0;display:flex;align-items:center;gap:8px;border-width:0 0 1px 0}
.ahd b{font-size:16px;flex:1}
#app-frame{flex:1;border:0;width:100%;background:#fff}

/* звонок */
#call{position:fixed;inset:0;z-index:850;background:#0c0c11;display:none;flex-direction:column;align-items:center}
#call.on{display:flex}
#r-vid{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#000;display:none}
#call.v #r-vid{display:block}
#l-vid{position:absolute;right:14px;top:calc(76px + env(safe-area-inset-top));width:96px;height:136px;object-fit:cover;border-radius:16px;background:#222;border:2px solid rgba(255,255,255,.3);transform:scaleX(-1);display:none;z-index:2}
#call.v #l-vid{display:block}
.c-top{position:absolute;top:calc(10px + env(safe-area-inset-top));left:10px;z-index:3}
.c-mid{position:absolute;top:22%;left:0;right:0;text-align:center;z-index:2;display:flex;flex-direction:column;align-items:center;gap:10px;text-shadow:0 1px 8px rgba(0,0,0,.6)}
#call.v .c-mid{top:calc(18px + env(safe-area-inset-top))}
#call.v .c-mid .av{display:none}
.c-mid b{font-size:26px}
.c-mid span{color:#d0d0da;font-size:15px}
.c-btns{position:absolute;bottom:calc(36px + env(safe-area-inset-bottom));left:0;right:0;display:flex;justify-content:center;gap:22px;z-index:3}
.cb{width:62px;height:62px;border-radius:50%;background:rgba(255,255,255,.18);display:grid;place-items:center;-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.cb.off{background:#fff}.cb.off .ic{stroke:#111}
.cb.end{background:#e5484d}.cb.ok{background:#2fb86b}
#call:not(.v) #b-cam{display:none}
#incoming{position:fixed;inset:0;z-index:880;display:none;background:rgba(10,10,15,.84);-webkit-backdrop-filter:blur(24px);backdrop-filter:blur(24px)}
#incoming.on{display:block}
#callbar{position:fixed;top:0;left:0;right:0;height:calc(50px + env(safe-area-inset-top));padding:env(safe-area-inset-top) 12px 0 18px;z-index:840;display:none;align-items:center;justify-content:space-between;background:linear-gradient(90deg,#1c8f54,#26b36a);cursor:pointer;font-weight:600}
#callbar.on{display:flex}
#callbar .cb{width:38px;height:38px}
body.incall #app{top:calc(50px + env(safe-area-inset-top))}
</style>
</head>
<body>
<div class="bg"><i class="s1"></i><i class="s2"></i><i class="s3"></i></div>

<svg style="position:absolute;width:0;height:0" aria-hidden="true">
<symbol id="i-chat" viewBox="0 0 24 24"><path d="M21 11.5a8.4 8.4 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.4 8.4 0 0 1-3.8-.9L3 21l1.9-5.7a8.4 8.4 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.4 8.4 0 0 1 3.8-.9h.5a8.5 8.5 0 0 1 8 8z"/></symbol>
<symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></symbol>
<symbol id="i-user" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></symbol>

function spark(size, anim) {
  const lens = [42, 28, 38, 42, 27, 36, 41, 30, 40, 26, 39, 34];
  let s = `<svg viewBox="0 0 100 100" width="${size}" height="${size}" fill="none" stroke="#d97757" stroke-width="7.5" stroke-linecap="round">`;
  lens.forEach((l, i) => {
    const a = (i * 30 - 90) * Math.PI / 180, c = Math.cos(a), n = Math.sin(a);
    s += `<line ${anim ? `class="ray" pathLength="1" style="--i:${i}"` : ''} x1="${50 + c * 8}" y1="${50 + n * 8}" x2="${50 + c * l}" y2="${50 + n * l}"/>`;
  });

}
