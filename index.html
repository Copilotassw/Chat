<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover,interactive-widget=resizes-content">
<title>ClaudeMAX</title>
<meta name="theme-color" content="#0d0d12">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
html,body{height:100%;overflow:hidden;background:#0d0d12;color:#f2f2f5}
body{position:fixed;inset:0;-webkit-user-select:none;user-select:none}
input{-webkit-user-select:text;user-select:text;font-size:16px;color:#fff}
button{border:0;background:none;color:inherit;cursor:pointer}
:root{--acc:#d97757;--hh:calc(58px + env(safe-area-inset-top));--nh:calc(60px + env(safe-area-inset-bottom));--mut:#a6a6b3}

/* ---------- BACKGROUND (яркие фигуры под стеклом, чтобы блюр был виден) ---------- */
.bg{position:fixed;inset:0;z-index:0;overflow:hidden;background:#0d0d12}
.bg i{position:absolute;border-radius:50%;will-change:transform}
.s1{width:320px;height:320px;top:-70px;left:-80px;background:radial-gradient(circle at 30% 30%,#ffa27d,#d97757 55%,#9c3f25);animation:d1 18s ease-in-out infinite alternate}
.s2{width:360px;height:360px;bottom:-110px;right:-110px;background:radial-gradient(circle at 30% 30%,#9a9bff,#5a5ad8 60%,#2b2b8c);animation:d2 22s ease-in-out infinite alternate}
.s3{width:210px;height:210px;top:42%;left:52%;background:radial-gradient(circle at 30% 30%,#6ff2dc,#0fb0a4 60%,#05605b);animation:d1 26s ease-in-out infinite alternate-reverse}
.bg::after{content:"";position:absolute;inset:0;background:rgba(10,10,15,.28)}
@keyframes d1{to{transform:translate(50px,70px)}}
@keyframes d2{to{transform:translate(-60px,-50px)}}

/* ---------- GLASS ---------- */
.glass{background:rgba(24,24,34,.5);-webkit-backdrop-filter:blur(22px) saturate(170%);backdrop-filter:blur(22px) saturate(170%);border:1px solid rgba(255,255,255,.12)}
.ic{width:24px;height:24px;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.ic.fill{fill:#fff}
.ib{width:42px;height:42px;display:grid;place-items:center;flex-shrink:0;border-radius:50%;cursor:pointer}
.ib:active{background:rgba(255,255,255,.14)}

/* ---------- VIEWS ---------- */
#app{position:fixed;inset:0;z-index:1}
.view{position:absolute;inset:0;display:none;flex-direction:column}
.view.on{display:flex;animation:vin .22s ease-out}
@keyframes vin{from{transform:translateY(14px)}to{transform:none}}
.hd{position:absolute;top:0;left:0;right:0;height:var(--hh);padding:env(safe-area-inset-top) 10px 0 14px;display:flex;align-items:center;gap:8px;z-index:5;border-width:0 0 1px 0}
.hd h1{font-size:21px;font-weight:800;flex:1;letter-spacing:.2px}
.nav{position:absolute;bottom:0;left:0;right:0;height:var(--nh);padding-bottom:env(safe-area-inset-bottom);display:flex;z-index:5;border-width:1px 0 0 0}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;color:var(--mut)}
.nav button.on{color:#fff}
.nav button.on .ic{stroke:var(--acc)}
.scroll{position:absolute;inset:0;overflow-y:auto;overscroll-behavior:contain;padding:calc(var(--hh) + 12px) 14px calc(var(--nh) + 14px)}

/* ---------- SPLASH / WELCOME ---------- */
#splash,#welcome{position:fixed;inset:0;z-index:900;background:#0b0b10;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:30px;transition:opacity .45s}
#splash.off,#welcome.off{opacity:0;pointer-events:none}
#welcome{display:none;z-index:800}
#welcome.on{display:flex}
.spin{animation:spin 9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.sp-title{font-size:30px;font-weight:800;margin-top:18px;letter-spacing:.5px}
.sp-tip{height:44px;margin-top:26px;display:flex;align-items:center;text-align:center;color:var(--mut);font-size:14px;max-width:290px}
.sp-tip span{animation:fi .4s}
.sp-bar{width:150px;height:4px;border-radius:4px;background:rgba(255,255,255,.12);margin-top:14px;overflow:hidden}
.sp-bar i{display:block;height:100%;background:var(--acc);border-radius:4px;animation:ld 2.2s ease-out forwards}
@keyframes ld{from{width:0}to{width:100%}}
@keyframes fi{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.ray{stroke-dasharray:1;stroke-dashoffset:1;animation:ray .45s ease-out forwards;animation-delay:calc(var(--i)*70ms)}
@keyframes ray{to{stroke-dashoffset:0}}
.wl-hi{font-size:30px;font-weight:800;margin-top:22px;animation:fi .5s .9s both;text-align:center}
.wl-sub{color:var(--mut);margin-top:6px;animation:fi .5s 1.1s both}

/* ---------- LANG PILL (белая капсула) ---------- */
.lang{position:relative;display:inline-flex;background:#fff;border-radius:999px;padding:3px;cursor:pointer;flex-shrink:0}
.lang i{position:absolute;top:3px;bottom:3px;left:3px;width:calc(50% - 3px);background:#111;border-radius:999px;transition:transform .25s}
.lang.en i{transform:translateX(100%)}
.lang b{position:relative;z-index:1;min-width:42px;text-align:center;padding:5px 0;font-size:12px;font-weight:800;color:#666;transition:color .25s}
.lang b.on{color:#fff}

/* ---------- AUTH ---------- */
#v-auth{align-items:center;justify-content:center;padding:20px;overflow-y:auto}
.au-top{position:absolute;top:calc(14px + env(safe-area-inset-top));right:14px}
.au-head{text-align:center;margin-bottom:22px}
.au-head h2{font-size:30px;font-weight:800;margin-top:14px}
.au-head p{color:#d8d8e2;margin-top:4px;font-size:14px}
.au-card{width:100%;max-width:380px;border-radius:28px;padding:20px;box-shadow:0 20px 50px rgba(0,0,0,.4)}
.seg{display:flex;background:rgba(0,0,0,.3);border-radius:14px;padding:3px;margin-bottom:14px}
.seg button{flex:1;padding:10px;border-radius:11px;font-weight:700;font-size:14px;color:var(--mut);transition:.2s}
.seg button.on{background:rgba(255,255,255,.16);color:#fff}
.fld{width:100%;background:rgba(0,0,0,.3);border:1px solid rgba(255,255,255,.14);border-radius:14px;padding:14px 16px;outline:none;margin-bottom:10px;transition:border .2s}
.fld:focus{border-color:var(--acc)}
.err{color:#ff8a80;font-size:13px;min-height:18px;margin:2px 2px 8px}
.btn{width:100%;background:linear-gradient(135deg,#e2825f,#d06a48);color:#fff;border-radius:14px;padding:14px;font-weight:700;font-size:15px;box-shadow:0 6px 18px rgba(217,119,87,.3)}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.6}
.btn.ghost{background:rgba(255,255,255,.1);box-shadow:none;margin-top:8px}
.btn.sm{width:auto;padding:9px 16px;font-size:13px}

/* ---------- CHAT LIST ---------- */
.ci{display:flex;align-items:center;gap:12px;padding:11px 12px;margin-bottom:8px;border-radius:18px;background:rgba(28,28,40,.5);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.09);cursor:pointer}
.ci:active{background:rgba(255,255,255,.12)}
.ci .mid{flex:1;min-width:0}
.ci .nm{font-weight:700;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ci .ls{color:var(--mut);font-size:13.5px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ci .tm{font-size:11px;color:var(--mut);align-self:flex-start;margin-top:4px}
.av{border-radius:50%;display:grid;place-items:center;font-weight:800;color:#fff;background-size:cover;background-position:center;flex-shrink:0}
.hint{text-align:center;color:var(--mut);padding:30px 20px;font-size:14px}

/* ---------- ROOM ---------- */
#room-bg{position:absolute;inset:0}
#msgs{position:absolute;inset:0;overflow-y:auto;overscroll-behavior:contain;display:flex;flex-direction:column;padding:calc(var(--hh) + 10px) 12px calc(78px + env(safe-area-inset-bottom))}
.hd .rt{flex:1;min-width:0;line-height:1.2}
.hd .rt b{font-size:16px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hd .rt small{font-size:12px;color:var(--mut)}
.hd .rt small.on{color:#7ee2a8}
.m{max-width:82%;width:fit-content;padding:8px 12px 5px;border-radius:18px;font-size:15px;line-height:1.35;margin-bottom:6px;white-space:pre-wrap;word-break:break-word;-webkit-user-select:text;user-select:text;animation:pop .18s ease-out}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.96)}to{opacity:1;transform:none}}
.m.in{align-self:flex-start;background:rgba(30,30,42,.6);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.1);border-bottom-left-radius:5px}
.m.out{align-self:flex-end;background:linear-gradient(135deg,#e2825f,#d06a48);border-bottom-right-radius:5px}
.m .who{font-size:12px;font-weight:700;color:#ffb596;margin-bottom:2px}
.m .tm{font-size:10.5px;opacity:.65;text-align:right;margin-top:2px}
.m img{max-width:100%;max-height:300px;border-radius:12px;display:block;margin:2px 0;cursor:pointer}
.voice{display:flex;align-items:center;gap:10px;min-width:210px;padding:2px 0}
.vp{width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.22);display:grid;place-items:center;flex-shrink:0}
.vmid{flex:1}
.vbar{height:4px;border-radius:3px;background:rgba(255,255,255,.28);overflow:hidden}
.vbar i{display:block;height:100%;width:0;background:#fff}
.vt{font-size:11px;opacity:.85;margin-top:5px;display:block}

.bar{position:absolute;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom));min-height:56px;border-radius:28px;z-index:5;padding:6px;transition:border-color .2s}
.bar-n,.bar-r{display:flex;align-items:center;gap:6px}
.bar-r{display:none}
.bar.rec{border-color:rgba(255,90,90,.6)}
.bar.rec .bar-n{display:none}
.bar.rec .bar-r{display:flex}
.bar .inp{flex:1;min-width:0;background:rgba(255,255,255,.08);border:0;border-radius:22px;padding:11px 16px;outline:none}
.send{width:42px;height:42px;border-radius:50%;background:var(--acc);display:grid;place-items:center;flex-shrink:0}
.send:active{transform:scale(.92)}
.bar:not(.txt) #sendb{display:none}
.bar.txt #mic{display:none}
.bar.bot #attach,.bar.bot #mic{display:none}
.bar.bot #sendb{display:grid}
.rec-info{flex:1;min-width:0;padding:0 6px}
.rec-l1{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:700;color:#ff8a80}
.rdot{width:10px;height:10px;border-radius:50%;background:#ff4d4d;animation:rd 1s infinite}
@keyframes rd{50%{opacity:.25;transform:scale(.7)}}
.rec-l2{display:flex;align-items:center;gap:10px;margin-top:3px}
.rec-l2 b{font-variant-numeric:tabular-nums;font-size:15px;min-width:38px}
.wave{display:flex;align-items:center;gap:3px;height:22px;flex:1;overflow:hidden}
.wave u{width:3px;height:100%;background:#ff6b6b;border-radius:2px;animation:wv .9s ease-in-out infinite}
.wave u:nth-child(3n){animation-delay:-.3s}.wave u:nth-child(3n+1){animation-delay:-.6s}.wave u:nth-child(5n){animation-delay:-.15s}
@keyframes wv{0%,100%{transform:scaleY(.2)}50%{transform:scaleY(1)}}

/* ---------- PROFILE ---------- */
.pcard{border-radius:24px;overflow:hidden;margin-bottom:14px;background:rgba(28,28,40,.5);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.1)}
.pban{height:110px}
.pav{margin:-44px auto 0;width:88px;height:88px;position:relative}
.pav .cam{position:absolute;right:-2px;bottom:-2px;width:30px;height:30px;border-radius:50%;background:var(--acc);display:grid;place-items:center;border:2px solid #1b1b26}
.pav .cam .ic{width:16px;height:16px}
.pbody{padding:14px 18px 18px}
.lbl{font-size:11px;color:var(--mut);font-weight:700;letter-spacing:.6px;margin:6px 2px;text-transform:uppercase}
.sw{display:flex;gap:10px;flex-wrap:wrap;margin:4px 0 14px}
.sw i{width:32px;height:32px;border-radius:50%;border:3px solid transparent;cursor:pointer}
.sw i.on{border-color:#fff}
.rowb{display:flex;align-items:center;justify-content:space-between;margin:10px 0 14px}

/* ---------- SHEET / OVERLAYS ---------- */
.ov{position:fixed;inset:0;z-index:700;display:none;background:rgba(0,0,0,.5);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.ov.on{display:flex}
#sheet{align-items:flex-end}
.sh-box{width:100%;max-height:86vh;overflow-y:auto;border-radius:26px 26px 0 0;padding:10px 18px calc(20px + env(safe-area-inset-bottom));animation:up .25s ease-out;background:rgba(26,26,36,.7);-webkit-backdrop-filter:blur(26px);backdrop-filter:blur(26px);border:1px solid rgba(255,255,255,.12)}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
.grab{width:42px;height:4px;border-radius:3px;background:rgba(255,255,255,.3);margin:0 auto 14px}
.sh-box h3{font-size:18px;margin-bottom:12px}
.row{display:flex;align-items:center;gap:12px;padding:8px 4px;cursor:pointer;border-radius:12px}
.row:active{background:rgba(255,255,255,.08)}
.row .rm{flex:1;min-width:0}
.row .rm b{display:block;font-size:15px}
.row .rm small{color:var(--mut);font-size:12.5px}
.badge{font-size:11px;font-weight:700;background:rgba(217,119,87,.25);color:#ffb596;padding:3px 8px;border-radius:10px}
.walls{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px}
.walls i{height:64px;border-radius:14px;border:3px solid transparent;cursor:pointer}
.walls i.on{border-color:#fff}
#viewer{align-items:center;justify-content:center;background:rgba(0,0,0,.88)}
#viewer img{max-width:100%;max-height:100%}
#toast{position:fixed;top:calc(14px + env(safe-area-inset-top));left:50%;transform:translate(-50%,-90px);z-index:999;padding:11px 18px;border-radius:20px;font-size:14px;max-width:88%;text-align:center;transition:transform .3s}
#toast.on{transform:translate(-50%,0)}
@keyframes none{}
</style>
</head>
<body>
<div class="bg"><i class="s1"></i><i class="s2"></i><i class="s3"></i></div>

<svg style="position:absolute;width:0;height:0" aria-hidden="true">
<symbol id="i-chat" viewBox="0 0 24 24"><path d="M21 11.5a8.4 8.4 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.4 8.4 0 0 1-3.8-.9L3 21l1.9-5.7a8.4 8.4 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.4 8.4 0 0 1 3.8-.9h.5a8.5 8.5 0 0 1 8 8z"/></symbol>
<symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></symbol>
<symbol id="i-user" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></symbol>
<symbol id="i-users" viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.9"/><path d="M16 3.1a4 4 0 0 1 0 7.8"/></symbol>
<symbol id="i-plus" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></symbol>
<symbol id="i-back" viewBox="0 0 24 24"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></symbol>
<symbol id="i-send" viewBox="0 0 24 24"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></symbol>
<symbol id="i-clip" viewBox="0 0 24 24"><path d="M21.4 11l-9.2 9.2a6 6 0 0 1-8.5-8.5l9.2-9.2a4 4 0 0 1 5.7 5.7l-9.2 9.2a2 2 0 0 1-2.8-2.8l8.5-8.5"/></symbol>
<symbol id="i-mic" viewBox="0 0 24 24"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/></symbol>
<symbol id="i-trash" viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></symbol>
<symbol id="i-bot" viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="10" rx="2"/><circle cx="12" cy="5" r="2"/><path d="M12 7v4"/><path d="M8 16h.01M16 16h.01"/></symbol>
<symbol id="i-play" viewBox="0 0 24 24"><polygon points="7 4 20 12 7 20 7 4"/></symbol>
<symbol id="i-pause" viewBox="0 0 24 24"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></symbol>
<symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></symbol>
<symbol id="i-out" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></symbol>
<symbol id="i-cam" viewBox="0 0 24 24"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></symbol>
<symbol id="i-check" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></symbol>
</svg>

<!-- SPLASH -->
<div id="splash">
  <div class="spin" data-spark="96"></div>
  <div class="sp-title">ClaudeMAX</div>
  <div class="sp-tip"><span id="sp-tip"></span></div>
  <div class="sp-bar"><i></i></div>
</div>

<!-- WELCOME после входа -->
<div id="welcome">
  <div id="wl-logo"></div>
  <div class="wl-hi" id="wl-hi"></div>
  <div class="wl-sub" data-t="welcomeTo"></div>
</div>

<div id="app">

  <!-- AUTH -->
  <section class="view" id="v-auth">
    <div class="au-top"><div class="lang" onclick="toggleLang()"><i></i><b data-l="ru">RU</b><b data-l="en">EN</b></div></div>
    <div class="au-head">
      <div class="spin" data-spark="76" style="display:inline-block"></div>
      <h2 id="greet"></h2>
      <p data-t="welcomeTo"></p>
    </div>
    <div class="au-card glass">
      <div class="seg"><button id="m-login" class="on" onclick="setMode('login')" data-t="login"></button><button id="m-reg" onclick="setMode('reg')" data-t="register"></button></div>
      <input class="fld" id="a-user" data-ph="username" autocomplete="username" autocapitalize="off" autocorrect="off" spellcheck="false">
      <input class="fld" id="a-pass" type="password" data-ph="password" autocomplete="current-password">
      <div class="err" id="a-err"></div>
      <button class="btn" id="a-btn" onclick="doAuth()"></button>
    </div>
  </section>

  <!-- CHATS -->
  <section class="view" id="v-chats">
    <div class="scroll" id="chat-list"></div>
    <div class="hd glass"><h1>ClaudeMAX</h1>
      <button class="ib" onclick="openSearch()"><svg class="ic"><use href="#i-search"/></svg></button>
      <button class="ib" onclick="openNewGroup()"><svg class="ic"><use href="#i-users"/></svg></button>
    </div>
    <div class="nav" data-a="chats"></div>
  </section>

  <!-- BOTS -->
  <section class="view" id="v-bots">
    <div class="scroll" id="bots-list"></div>
    <div class="hd glass"><h1 data-t="bots"></h1><button class="ib" onclick="newBot()"><svg class="ic"><use href="#i-plus"/></svg></button></div>
    <div class="nav" data-a="bots"></div>
  </section>

  <!-- PROFILE -->
  <section class="view" id="v-profile">
    <div class="scroll">
      <div class="pcard">
        <div class="pban" id="p-ban"></div>
        <div class="pav"><div id="p-av"></div><label class="cam"><svg class="ic"><use href="#i-cam"/></svg><input type="file" id="p-file" accept="image/*" hidden></label></div>
        <div class="pbody">
          <div style="text-align:center;margin-bottom:14px"><b id="p-nm" style="font-size:20px"></b><div id="p-un" style="color:var(--mut);font-size:14px"></div></div>
          <div class="lbl" data-t="name"></div><input class="fld" id="p-name" maxlength="32">
          <div class="lbl" data-t="bio"></div><input class="fld" id="p-bio" maxlength="120">
          <div class="lbl" data-t="usernameT"></div><input class="fld" id="p-user" maxlength="20" autocapitalize="off" spellcheck="false">
          <div class="lbl" data-t="color"></div><div class="sw" id="p-sw"></div>
          <button class="btn" onclick="saveProfile()" data-t="save"></button>
        </div>

function spark(size, anim) {

  lens.forEach((l, i) => {
    const a = (i * 30 - 90) * Math.PI / 180, c = Math.cos(a), n = Math.sin(a);
    s += `<line ${anim ? `class="ray" pathLength="1" style="--i:${i}"` : ''} x1="${50 + c * 8}" y1="${50 + n * 8}" x2="${50 + c * l}" y2="${50 + n * l}"/>`;
  });
  return s + '</svg>';
}

  if (room.type === 'bot') { av = avatar(CLAUD, 40); title = 'ClaudBOT'; st = t('bot'); }
  else if (room.type === 'group') { title = c.title; av = avatar({ name: title, color: colorOf(title) }, 40); st = (c.members || []).length + ' ' + t('members'); }
  else { const u = room.od || userCache[otherOf(c)] || { name: '…' }; title = u.name; av = avatar(u, 40); const s = statusOf(room.od); st = s.txt; on = s.on; }
  $('r-av').replaceChildren(av); $('r-t').textContent = title; const s = $('r-s'); s.textContent = st; s.classList.toggle('on', !!on);
}
window.openRoom = async id => {
  const c = chats[id];
  if (id !== 'claudbot' && !c) return;
  room = { id, type: id === 'claudbot' ? 'bot' : (c.group ? 'group' : 'dm'), chat: c, stick: true, od: null };
  history.pushState({ room: 1 }, '');
  $('bar').classList.toggle('bot', room.type === 'bot'); $('bar').classList.remove('rec', 'txt'); $('msg').value = '';
  const box = $('msgs'); box.innerHTML = '';
  box.onscroll = () => { room.stick = box.scrollHeight - box.scrollTop - box.clientHeight < 140; };
  applyWall(); refreshHeader(); show('room');
  statusUnsub && statusUnsub(); clearInterval(statusTimer); msgsUnsub && msgsUnsub();
  if (room.type === 'bot') { botLog.forEach((m, i) => box.append(msgEl(m, 'b' + i))); stick(true); return; }
  if (room.type === 'dm') {
    const o = otherOf(c);
    statusUnsub = onSnapshot(doc(db, 'users', o), s => { if (s.exists() && room) { room.od = s.data({ serverTimestamps: 'estimate' }); userCache[o] = room.od; refreshHeader(); } });
    statusTimer = setInterval(refreshHeader, 30000);
  }
  let first = true;
  const myRoom = room;
  msgsUnsub = onSnapshot(query(collection(db, `chats/${id}/messages`), orderBy('createdAt', 'desc'), limit(60)), snap => {
    if (room !== myRoom) return;
    const ch = snap.docChanges(), adds = ch.filter(x => x.type === 'added');
    if (first) { adds.reverse(); first = false; }
    adds.forEach(x => box.append(msgEl(x.doc.data({ serverTimestamps: 'estimate' }), x.doc.id)));
    ch.filter(x => x.type === 'modified').forEach(x => {
      const el = box.querySelector(`[data-id="${x.doc.id}"] .tm`);
      if (el) el.textContent = hm(toDate(x.doc.data({ serverTimestamps: 'estimate' }).createdAt));
    });
    stick();
  }, e => toast(e.message));
};
function leaveRoom() {
  if (!room) return;
  stopRec(false); if (curAudio) curAudio.pause();
  msgsUnsub && msgsUnsub(); statusUnsub && statusUnsub(); clearInterval(statusTimer);
  room = null; closeSheet(); show('chats'); renderChats();
}
window.addEventListener('popstate', leaveRoom);
function stick(force) { const b = $('msgs'); if (force || (room && room.stick)) requestAnimationFrame(() => b.scrollTop = b.scrollHeight); }
function msgEl(m, id) {
  const isMe = m.uid === me.uid, el = h('div', 'm ' + (isMe ? 'out' : 'in')); el.dataset.id = id;
  if (!isMe && room.type === 'group') { const w = h('div', 'who'); el.append(w); getUser(m.uid).then(u => w.textContent = u.name); }
  if (m.img) { const im = new Image(); im.src = m.img; im.onclick = () => { $('viewer-img').src = m.img; $('viewer').classList.add('on'); }; im.onload = () => stick(); el.append(im); }
  if (m.audio) el.append(voiceEl(m.audio, m.dur || 0));
  if (m.text) { const x = h('div'); x.textContent = m.text; el.append(x); }
  const tm = h('div', 'tm'); tm.textContent = hm(toDate(m.createdAt || m.ts)); el.append(tm);
  return el;
}
$('viewer').onclick = () => $('viewer').classList.remove('on');

/* ---------------- ОТПРАВКА ---------------- */
const barState = () => $('bar').classList.toggle('txt', !!$('msg').value.trim());
$('msg').addEventListener('input', barState);
$('msg').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); sendText(); } });
async function send(p, prev) {
  try {
    room.stick = true;
    await addDoc(collection(db, `chats/${room.id}/messages`), { uid: me.uid, ...p, createdAt: serverTimestamp() });
    await updateDoc(doc(db, 'chats', room.id), { lastText: prev, lastAt: serverTimestamp(), lastUid: me.uid });
  } catch (e) { toast(t('sendErr') + ': ' + (e.code || e.message)); }
}
window.sendText = async () => {
  const inp = $('msg'), tx = inp.value.trim(); if (!tx || !room) return;
  inp.value = ''; barState(); inp.focus();
  if (room.type === 'bot') return botHandle(tx);
  await send({ text: tx }, tx);
};
function resizeImg(file, max, q) {
  return new Promise((res, rej) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const k = Math.min(1, max / Math.max(img.width, img.height)), w = Math.round(img.width * k), hh = Math.round(img.height * k);
      const c = document.createElement('canvas'); c.width = w; c.height = hh; c.getContext('2d').drawImage(img, 0, 0, w, hh);
      URL.revokeObjectURL(url);
      let out = c.toDataURL('image/jpeg', q); if (out.length > 900000) out = c.toDataURL('image/jpeg', .45);
      res(out);
    };
    img.onerror = rej; img.src = url;
  });
}
$('file').onchange = async e => {
  const f = e.target.files[0]; e.target.value = ''; if (!f || !room) return;
  try { await send({ img: await resizeImg(f, 800, .7) }, t('photo')); } catch { toast(t('sendErr')); }
};

/* ---------------- ГОЛОСОВЫЕ ---------------- */
let rec = null, curAudio = null;
window.startRec = async () => {
  if (rec || !room) return;
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || !window.MediaRecorder) return toast(t('noMic'));
  let stream; try { stream = await navigator.mediaDevices.getUserMedia({ audio: true }); } catch { return toast(t('noMic')); }
  const mime = ['audio/webm;codecs=opus', 'audio/webm', 'audio/mp4'].find(m => MediaRecorder.isTypeSupported(m)) || '';
  const mr = new MediaRecorder(stream, mime ? { mimeType: mime, audioBitsPerSecond: 24000 } : { audioBitsPerSecond: 24000 });
  const r = { mr, stream, chunks: [], t0: Date.now(), send: false, rid: room.id };
  mr.ondataavailable = e => e.data.size && r.chunks.push(e.data);
  mr.onstop = async () => {
    stream.getTracks().forEach(x => x.stop());
    if (!r.send || !room || room.id !== r.rid) return;
    const dur = (Date.now() - r.t0) / 1000;
    if (dur < .7) return toast(t('tooShort'));
    const blob = new Blob(r.chunks, { type: mr.mimeType || 'audio/webm' });
    if (blob.size > 700000) return toast(t('tooBig'));
    const fr = new FileReader();
    fr.onloadend = () => send({ audio: fr.result, dur: Math.round(dur) }, t('voice'));
    fr.readAsDataURL(blob);
  };
  mr.start(250); rec = r; $('bar').classList.add('rec'); $('rec-t').textContent = '0:00';
  if (navigator.vibrate) navigator.vibrate(30);
  r.timer = setInterval(() => {
    const s = (Date.now() - r.t0) / 1000; $('rec-t').textContent = fmtDur(s);
    if (s >= 30) stopRec(true);
  }, 200);
};
window.stopRec = send => {
  const r = rec; if (!r) return; rec = null; r.send = send; clearInterval(r.timer);
  $('bar').classList.remove('rec');
  if (r.mr.state !== 'inactive') r.mr.stop();
};
function voiceEl(src, dur) {
  const w = h('div', 'voice');
  w.innerHTML = `<button class="vp"><svg class="ic fill"><use href="#i-play"/></svg></button><div class="vmid"><div class="vbar"><i></i></div><span class="vt">${fmtDur(dur)}</span></div>`;
  const a = new Audio(src), btn = w.querySelector('.vp'), use = w.querySelector('use'), bar = w.querySelector('.vbar i'), vt = w.querySelector('.vt');
  btn.onclick = () => { if (curAudio && curAudio !== a) curAudio.pause(); a.paused ? a.play() : a.pause(); };
  a.onplay = () => { curAudio = a; use.setAttribute('href', '#i-pause'); };
  a.onpause = () => use.setAttribute('href', '#i-play');
  a.onended = () => { bar.style.width = '0'; vt.textContent = fmtDur(dur); };
  a.ontimeupdate = () => { const d = dur || a.duration || 1; bar.style.width = Math.min(100, a.currentTime / d * 100) + '%'; vt.textContent = fmtDur(a.currentTime); };
  return w;
}

/* ---------------- ШИТЫ: поиск, группы, инфо ---------------- */
function sheet(node) { const b = $('sheet-body'); b.replaceChildren(node); $('sheet').classList.add('on'); }
function closeSheet() { $('sheet').classList.remove('on'); }
$('sheet').addEventListener('click', e => { if (e.target.id === 'sheet') closeSheet(); });
async function findUsers(term) {
  term = term.trim().toLowerCase().replace(/^@/, ''); if (!term) return [];
  const s = await getDocs(query(collection(db, 'users'), where('username', '>=', term), where('username', '<=', term + '\uf8ff'), limit(10)));
  return s.docs.filter(d => d.id !== me.uid).map(d => ({ id: d.id, ...d.data() }));
}
function searchBox(w, onPick) {
  const inp = h('input', 'fld'); inp.placeholder = t('searchPh'); inp.autocapitalize = 'off'; inp.spellcheck = false;
  const res = h('div'); let tm;
  inp.oninput = () => { clearTimeout(tm); tm = setTimeout(async () => {
    try {
      const us = await findUsers(inp.value); res.innerHTML = '';
      if (!us.length && inp.value.trim()) res.append(h('div', 'hint', t('nothing')));
      us.forEach(u => { userCache[u.id] = u; const r = userRow(u); r.onclick = () => onPick(u); res.append(r); });
    } catch (e) { toast(e.message); }
  }, 300); };
  w.append(inp, res); return inp;
}
window.openSearch = () => {
  const w = h('div', '', `<h3>${t('search')}</h3>`);
  searchBox(w, async u => {
    const id = [me.uid, u.id].sort().join('_');
    try { await setDoc(doc(db, 'chats', id), { members: [me.uid, u.id], group: false }, { merge: true }); } catch (e) { return toast(e.message); }
    chats[id] = chats[id] || { members: [me.uid, u.id], group: false };
    closeSheet(); openRoom(id);
  });
  sheet(w); setTimeout(() => w.querySelector('input').focus(), 250);
};
window.openNewGroup = () => {
  const w = h('div', '', `<h3>${t('newGroup')}</h3>`), inp = h('input', 'fld'); inp.placeholder = t('groupName'); inp.maxLength = 40;
  const ok = h('button', 'btn', t('create')), no = h('button', 'btn ghost', t('cancel'));
  ok.onclick = async () => {
    const name = inp.value.trim(); if (!name) return;
    const data = { members: [me.uid], group: true, title: name, admins: [me.uid], wall: 0, lastText: '', lastUid: '' };
    try { const r = await addDoc(collection(db, 'chats'), { ...data, lastAt: serverTimestamp() }); chats[r.id] = data; closeSheet(); openRoom(r.id); } catch (e) { toast(e.message); }
  };
  no.onclick = closeSheet; w.append(inp, ok, no); sheet(w); setTimeout(() => inp.focus(), 250);
};
window.openInfo = async () => {
  if (!room) return;
  const c = room.chat || {}, isG = room.type === 'group', adm = !isG || (c.admins || []).includes(me.uid), w = h('div');
  if (room.type === 'bot') return;
  w.append(h('h3', '', t('wallpaper')));
  const walls = h('div', 'walls');
  WALLS.forEach((bg, i) => {
    const d = h('i'); d.style.background = bg; if ((c.wall || 0) === i) d.classList.add('on');
    d.onclick = async () => {
      if (!adm) return toast(t('onlyAdmin'));
      try { await updateDoc(doc(db, 'chats', room.id), { wall: i }); c.wall = i; applyWall(); walls.querySelectorAll('i').forEach(x => x.classList.remove('on')); d.classList.add('on'); } catch (e) { toast(e.message); }
    };
    walls.append(d);
  });
  w.append(walls);
  if (isG) {
    w.append(h('h3', '', `${t('membersT')} (${c.members.length})`));
    const list = h('div'); w.append(list);
    for (const uid of c.members) {
      const u = await getUser(uid); let btn = null;
      const isA = (c.admins || []).includes(uid);
      if (isA) btn = h('span', 'badge', t('admin'));
      else if (adm) {
        btn = h('button', 'badge', t('makeAdmin'));
        btn.onclick = async e => { e.stopPropagation(); try { await updateDoc(doc(db, 'chats', room.id), { admins: arrayUnion(uid) }); c.admins = [...(c.admins || []), uid]; openInfo(); } catch (x) { toast(x.message); } };
      }
      list.append(userRow(u, btn));
    }
    w.append(h('h3', '', t('addMember')).constructor === HTMLElement ? '' : '');
    const ah = h('h3', '', t('addMember')); ah.style.marginTop = '16px'; w.append(ah);
    searchBox(w, async u => {
      if (c.members.includes(u.id)) return;
      try { await updateDoc(doc(db, 'chats', room.id), { members: arrayUnion(u.id) }); c.members = [...c.members, u.id]; toast(t('added')); openInfo(); } catch (x) { toast(x.message); }
    });
    const lv = h('button', 'btn ghost', t('leave')); lv.style.cssText = 'margin-top:16px;color:#ff8a80';
    lv.onclick = async () => {
      try {
        const rest = c.members.filter(x => x !== me.uid), upd = { members: arrayRemove(me.uid), admins: arrayRemove(me.uid) };
        await updateDoc(doc(db, 'chats', room.id), upd);
        if (rest.length && !(c.admins || []).some(a => a !== me.uid)) await updateDoc(doc(db, 'chats', room.id), { admins: [rest[0]] }).catch(() => {});
        delete chats[room.id]; history.back();
      } catch (x) { toast(x.message); }
    };
    w.append(lv);
  }
  sheet(w);
};

/* ---------------- ПРОФИЛЬ ---------------- */
function fillProfile() {
  if (!meData) return;
  $('p-ban').style.background = `linear-gradient(135deg,${tmpColor},#1b1b26)`;
  $('p-av').replaceChildren(avatar({ ...meData, color: tmpColor }, 88));
  $('p-nm').textContent = meData.name || meData.username; $('p-un').textContent = '@' + meData.username;
  $('p-name').value = meData.name || ''; $('p-bio').value = meData.bio || ''; $('p-user').value = meData.username;
  const sw = $('p-sw'); sw.innerHTML = '';
  COLORS.forEach(c => { const i = h('i', c === tmpColor ? 'on' : ''); i.style.background = c; i.onclick = () => { tmpColor = c; fillProfile(); }; sw.append(i); });
}
window.saveProfile = async () => {
  const name = $('p-name').value.trim().slice(0, 32) || meData.username, bio = $('p-bio').value.trim().slice(0, 120);
  const un = $('p-user').value.trim().toLowerCase().replace(/^@/, '');
  try {
    if (un !== meData.username) {
      if (!UNAME.test(un)) return toast(t('badUser'));
      const ex = await getDoc(doc(db, 'usernames', un).withConverter ? doc(db, 'usernames', un) : doc(db, 'usernames', un));
      if (ex.exists() && ex.data().uid !== me.uid) return toast(t('taken'));
      await setDoc(doc(db, 'usernames', un), { uid: me.uid, email: me.email });
      try { await deleteDoc(doc(db, 'usernames', meData.username)); } catch {}
    }
    await updateDoc(doc(db, 'users', me.uid), { name, bio, username: un, color: tmpColor });
    Object.assign(meData, { name, bio, username: un, color: tmpColor }); userCache[me.uid] = meData;
    toast(t('saved')); fillProfile();
  } catch (e) { toast(e.message); }
};
$('p-file').onchange = async e => {
  const f = e.target.files[0]; e.target.value = ''; if (!f) return;
  try { const url = await resizeImg(f, 256, .8); await updateDoc(doc(db, 'users', me.uid), { avatar: url }); meData.avatar = url; fillProfile(); toast(t('saved')); } catch (x) { toast(x.message); }
};

/* ---------------- БОТЫ ---------------- */
function listenBots() {
  botsUnsub && botsUnsub();
  botsUnsub = onSnapshot(query(collection(db, 'bots'), where('owner', '==', me.uid)), s => { myBots = s.docs.map(d => ({ id: d.id, ...d.data() })); renderBots(); }, () => {});
}
function renderBots() {
  const box = $('bots-list'); if (!box || !me) return; box.innerHTML = '';
  box.append(chatItem({ name: 'ClaudBOT', bot: true }, 'ClaudBOT', t('botHelp').split('\n')[0], 0, () => openRoom('claudbot')));
  const hd = h('div', 'lbl', t('myBots')); hd.style.margin = '14px 4px 8px'; box.append(hd);
  if (!myBots.length) box.append(h('div', 'hint', t('noBots')));
  myBots.forEach(b => {
    const it = chatItem({ name: b.name, bot: true }, b.name, 'ID: ' + b.id, 0, async () => { try { await navigator.clipboard.writeText(b.token); toast(t('copied')); } catch { toast(b.token); } });
    box.append(it);
  });
  const nb = h('button', 'btn', t('createBot')); nb.style.marginTop = '12px'; nb.onclick = newBot; box.append(nb);
}
window.newBot = () => { openRoom('claudbot').then(() => botHandle('/newbot')); };
let botLog = [], botFlow = null;
const botKey = () => 'cm_bot_' + me.uid;
function loadBotLog() {
  try { botLog = JSON.parse(localStorage.getItem(botKey()) || '[]'); } catch { botLog = []; }
  if (!botLog.length) botLog.push({ uid: 'claudbot', text: t('botHelp'), ts: Date.now() });
}
function pushBot(m) {
  m.ts = Date.now(); botLog.push(m); localStorage.setItem(botKey(), JSON.stringify(botLog.slice(-100)));
  if (room && room.type === 'bot') { $('msgs').append(msgEl(m, 'b' + botLog.length)); stick(true); }
}
const botSay = text => pushBot({ uid: 'claudbot', text });
async function botHandle(text) {
  pushBot({ uid: me.uid, text });
  const [cmd, ...args] = text.split(/\s+/);
  if (botFlow === 'name' && !text.startsWith('/')) {
    botFlow = null; const name = text.slice(0, 32), id = rnd(6, 'abcdefghijklmnopqrstuvwxyz0123456789'), tk = id + ':' + rnd(28, 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789');
    try { await setDoc(doc(db, 'bots', id), { owner: me.uid, token: tk, name, createdAt: serverTimestamp() }); botSay(t('botMade', { n: name, id, tk })); }
    catch (e) { botSay(e.message); }
    return;
  }
  botFlow = null;
  if (cmd === '/newbot') { botFlow = 'name'; botSay(t('botAsk')); }
  else if (cmd === '/mybots') botSay(myBots.length ? t('botList') + '\n' + myBots.map(b => `• ${b.name} — ${b.id}`).join('\n') : t('botNone'));
  else if (cmd === '/token') { const b = myBots.find(x => x.id === (args[0] || '').trim()); botSay(b ? b.token : t('botNo')); }
  else if (cmd === '/start' || cmd === '/help') botSay(t('botHelp'));
  else botSay(t('botUnk'));
}
