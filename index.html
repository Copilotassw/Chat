<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0a18">
<title>Buldog</title>
<style>
:root{--g:rgba(255,255,255,.09);--gb:rgba(255,255,255,.22);--mut:rgba(255,255,255,.6)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#0a0a18;color:#fff;font-family:-apple-system,"SF Pro Display",Roboto,system-ui,sans-serif;overflow:hidden}
.blob{position:fixed;border-radius:50%;filter:blur(70px);opacity:.75;animation:float 14s ease-in-out infinite;pointer-events:none}
.b1{width:340px;height:340px;background:#6a5cff;top:-80px;left:-80px}
.b2{width:300px;height:300px;background:#ff4f9a;bottom:60px;right:-90px;animation-delay:-5s}
.b3{width:260px;height:260px;background:#19d4c8;top:40%;left:20%;animation-delay:-9s;opacity:.45}
@keyframes float{0%,100%{transform:translate(0,0) scale(1)}33%{transform:translate(50px,70px) scale(1.15)}66%{transform:translate(-40px,30px) scale(.95)}}

.glass{position:relative;overflow:hidden;background:var(--g);backdrop-filter:blur(26px) saturate(180%);-webkit-backdrop-filter:blur(26px) saturate(180%);border:1px solid var(--gb);box-shadow:inset 0 1px 0 rgba(255,255,255,.4),inset 0 -1px 0 rgba(255,255,255,.06),0 10px 40px rgba(0,0,0,.35)}
.glass::before{content:"";position:absolute;inset:0;background:linear-gradient(135deg,rgba(255,255,255,.25),rgba(255,255,255,0) 42%);opacity:.5;pointer-events:none}

.mut{color:var(--mut)}.small{font-size:13px}
.in{width:100%;padding:14px 16px;border-radius:16px;border:1px solid var(--gb);background:rgba(255,255,255,.08);color:#fff;font-size:16px;outline:none;margin-bottom:10px;font-family:inherit;transition:.25s}
.in:focus{border-color:#9aa6ff;background:rgba(255,255,255,.14);box-shadow:0 0 0 4px rgba(124,140,255,.2)}
.in::placeholder{color:rgba(255,255,255,.45)}
textarea.in{resize:none;height:80px}
.btn{border:0;border-radius:18px;padding:14px 20px;font-size:16px;font-weight:600;color:#fff;background:linear-gradient(135deg,#7c8cff,#a45cff);box-shadow:0 8px 24px rgba(124,140,255,.45);transition:transform .15s;font-family:inherit}
.btn:active{transform:scale(.94)}
.btn.ghost{background:rgba(255,255,255,.13);box-shadow:none}
.btn.red{background:rgba(255,70,90,.35);box-shadow:none}
.btn:disabled{opacity:.6}
.row2{display:flex;gap:10px;margin:10px 0}.row2 .btn{flex:1}

#splash{position:fixed;inset:0;z-index:300;display:flex;align-items:center;justify-content:center;font-size:70px;background:#0a0a18;animation:pulse 1.2s infinite}
@keyframes pulse{50%{transform:scale(1.1)}}
#auth{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;padding:20px}
#auth.open{display:flex}
.acard{width:100%;max-width:400px;border-radius:34px;padding:28px 22px;text-align:center;animation:pin .6s cubic-bezier(.2,.8,.2,1)}
.logo{font-size:56px;animation:bob 3s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px) rotate(6deg)}}
.acard h1{margin:4px 0 2px;font-size:30px}
.seg{display:flex;background:rgba(255,255,255,.1);border-radius:16px;padding:4px;margin:16px 0}
.seg button{flex:1;border:0;background:none;color:var(--mut);padding:10px;border-radius:12px;font-size:15px;font-weight:600;transition:.3s;font-family:inherit}
.seg button.on{background:rgba(255,255,255,.22);color:#fff}
#err{color:#ff8a9a;min-height:20px;font-size:14px;margin-bottom:8px}

.page{position:absolute;inset:0;display:none;flex-direction:column}
.page.active{display:flex;animation:pin .4s cubic-bezier(.2,.8,.2,1)}
@keyframes pin{from{opacity:0;transform:translateY(16px) scale(.98)}to{opacity:1;transform:none}}
.top{padding:calc(env(safe-area-inset-top) + 20px) 22px 10px;font-size:32px;font-weight:700}
.scroll{flex:1;overflow-y:auto;padding:8px 14px 120px}
.inchat .page:not(#pChat){display:none!important}
.inchat .tabbar{display:none}

.tabbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom));display:flex;gap:4px;padding:7px;border-radius:32px;z-index:20}
.tab{border:0;background:none;color:var(--mut);padding:9px 22px;border-radius:25px;font-size:12px;display:flex;flex-direction:column;align-items:center;gap:2px;transition:.35s;font-family:inherit}
.tab span{font-size:21px}
.tab.on{background:rgba(255,255,255,.2);color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.35)}

.av{border-radius:50%;background-size:cover;background-position:center;display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff;border:3px solid rgba(255,255,255,.35);flex-shrink:0}
.row{display:flex;gap:14px;align-items:center;padding:12px 14px;border-radius:24px;margin-bottom:10px;animation:rise .5s both;animation-delay:calc(var(--i) * 45ms);transition:transform .15s}
.row:active{transform:scale(.97)}
@keyframes rise{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
.row .info{flex:1;min-width:0}
.row b{display:block;font-size:17px}
.row .last{color:var(--mut);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.row .time{color:var(--mut);font-size:12px}
.empty{text-align:center;color:var(--mut);padding:60px 30px;line-height:1.5;animation:rise .6s both}
.empty div{font-size:54px;margin-bottom:10px}

.prev{position:relative;margin-bottom:54px}
.banner{height:150px;border-radius:24px;background-size:cover;background-position:center}
.avwrap{position:absolute;left:18px;bottom:-46px}
.pname{font-size:26px;font-weight:700;padding:0 6px}
.pbio{padding:10px 6px 4px;line-height:1.45}
.pcard{border-radius:32px;padding:10px 10px 18px;animation:rise .6s both}

#pChat{z-index:30}
.chead{margin:calc(env(safe-area-inset-top) + 10px) 10px 0;border-radius:26px;padding:10px 14px;display:flex;align-items:center;gap:12px}
.ib{border:0;background:rgba(255,255,255,.14);color:#fff;width:38px;height:38px;border-radius:50%;font-size:24px;line-height:1;font-family:inherit}
.chinfo{flex:1;min-width:0}.chinfo b{display:block}.chinfo small{color:var(--mut)}
#msgs{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:6px}
.m{max-width:78%;display:flex;flex-direction:column}
.m.me{align-self:flex-end;align-items:flex-end}
.m .b{padding:10px 14px;border-radius:20px;font-size:16px;line-height:1.35;word-wrap:break-word;white-space:pre-wrap;max-width:100%}
.m.me .b{background:linear-gradient(135deg,#7c8cff,#a45cff);border-bottom-right-radius:6px;box-shadow:0 6px 20px rgba(124,92,255,.4)}
.m.ot .b{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.2);border-bottom-left-radius:6px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.m small{font-size:11px;color:var(--mut);margin:2px 6px 0}
.m.pop{animation:pop .35s cubic-bezier(.2,1.2,.4,1)}
.m.me.pop{transform-origin:bottom right}.m.ot.pop{transform-origin:bottom left}
@keyframes pop{from{opacity:0;transform:scale(.6) translateY(14px)}to{opacity:1;transform:none}}
.cbar{margin:0 10px calc(10px + env(safe-area-inset-bottom));border-radius:28px;padding:8px;display:flex;gap:8px;align-items:center}
.cbar input{flex:1;background:none;border:0;outline:none;color:#fff;font-size:16px;padding:8px 10px;font-family:inherit}
.cbar input::placeholder{color:rgba(255,255,255,.45)}
#send{border:0;width:44px;height:44px;border-radius:50%;color:#fff;font-size:18px;background:linear-gradient(135deg,#7c8cff,#a45cff);transition:transform .15s}
#send:active{transform:scale(.85) rotate(-15deg)}

.sheet{position:fixed;inset:0;z-index:50;display:none;align-items:flex-end;background:rgba(0,0,0,.45)}
.sheet.open{display:flex;animation:fade .3s}
@keyframes fade{from{opacity:0}}
.scard{width:100%;max-height:92dvh;overflow-y:auto;border-radius:34px 34px 0 0;padding:14px 14px calc(20px + env(safe-area-inset-bottom));background:rgba(28,28,60,.6);animation:up .45s cubic-bezier(.2,.9,.2,1)}
@keyframes up{from{transform:translateY(100%)}}
.gr{display:flex;gap:10px;margin:8px 0 14px;flex-wrap:wrap}
.gr i{width:38px;height:38px;border-radius:50%;border:3px solid transparent;transition:.25s}
.gr i.sel{border-color:#fff;transform:scale(1.18)}
.toast{position:fixed;top:calc(env(safe-area-inset-top) + 16px);left:50%;transform:translateX(-50%);z-index:400;padding:12px 20px;border-radius:20px;animation:rise .3s;max-width:90%;text-align:center}
</style>
</head>
<body>
<div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>
<div id="splash">🐶</div>

<div id="auth">
  <div class="acard glass">
    <div class="logo">🐶</div>
    <h1>Buldog</h1>
    <div class="mut small">Мессенджер нового поколения</div>
    <div class="seg"><button id="tLogin" class="on">Вход</button><button id="tReg">Регистрация</button></div>
    <input class="in" id="nm" placeholder="Имя (как тебя увидят друзья)" maxlength="30" style="display:none">
    <input class="in" id="un" placeholder="Ник, например ivan_01" autocapitalize="off" autocomplete="username" maxlength="20">
    <input class="in" id="pw" type="password" placeholder="Пароль (минимум 6 символов)" autocomplete="current-password">
    <div id="err"></div>
    <button class="btn" id="goBtn" style="width:100%">Войти</button>
  </div>
</div>

<div id="app" style="display:none">
  <div id="pChats" class="page"><div class="top">Чаты</div><div class="scroll" id="chatList"></div></div>
  <div id="pSearch" class="page">
    <div class="top">Поиск</div>
    <div style="padding:0 16px"><input class="in" id="q" placeholder="🔍  Ник друга" autocapitalize="off"></div>
    <div class="scroll" id="results"></div>
  </div>
  <div id="pProfile" class="page"><div class="top">Профиль</div><div class="scroll" id="prof"></div></div>

  <div id="pChat" class="page">
    <div class="chead glass">
      <button class="ib" id="back">‹</button>
      <div id="chAv"></div>
      <div class="chinfo" id="chInfo"><b id="chName"></b><small id="chSub"></small></div>
    </div>
    <div id="msgs"></div>
    <div class="cbar glass"><input id="mi" placeholder="Сообщение" autocomplete="off"><button id="send">➤</button></div>
  </div>

  <div class="tabbar glass">
    <button class="tab on" data-p="chats"><span>💬</span>Чаты</button>
    <button class="tab" data-p="search"><span>🔍</span>Поиск</button>
    <button class="tab" data-p="profile"><span>👤</span>Профиль</button>
  </div>
</div>

<div id="uSheet" class="sheet"><div class="scard glass" id="uCard"></div></div>

<div id="eSheet" class="sheet"><div class="scard glass">
  <div id="ePrev" class="prev"></div>
  <div class="row2"><button class="btn ghost" id="pickAv">📷 Аватар</button><button class="btn ghost" id="pickBn">🖼 Баннер</button></div>
  <div class="mut small">Цвет профиля</div>
  <div id="gr" class="gr"></div>
  <input class="in" id="eName" placeholder="Имя" maxlength="30">
  <textarea class="in" id="eBio" placeholder="О себе" maxlength="150"></textarea>
  <div class="row2"><button class="btn ghost" id="eCancel">Отмена</button><button class="btn" id="eSave">Сохранить</button></div>
  <input type="file" id="fAv" accept="image/*" hidden>
  <input type="file" id="fBn" accept="image/*" hidden>
</div></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, doc, getDoc, setDoc, updateDoc, addDoc, collection, query, where, orderBy, limit, onSnapshot, getDocs, serverTimestamp }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBFZH_-XzfXCVItFF0PXd2GBaI5_LRWCko",
  authDomain: "buldog-5fef9.firebaseapp.com",
  projectId: "buldog-5fef9"
};
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const EMAIL = u => u + "@buldog-chat.app";
const GR = [
  "linear-gradient(135deg,#ff6a88,#ff99ac)","linear-gradient(135deg,#7c8cff,#a45cff)",
  "linear-gradient(135deg,#19d4c8,#4facfe)","linear-gradient(135deg,#f7971e,#ffd200)",
  "linear-gradient(135deg,#43e97b,#38f9d7)","linear-gradient(135deg,#fa709a,#fee140)",
  "linear-gradient(135deg,#667eea,#764ba2)","linear-gradient(135deg,#f093fb,#f5576c)"
];
let me = null, registering = false, cache = {}, unsubChats = null, unsubMsgs = null;
let curUser = null, curChat = null, seen = new Set(), mode = "login", ed = {};

function toast(t) {
  const d = document.createElement("div");
  d.className = "toast glass"; d.textContent = t;
  document.body.appendChild(d);
  setTimeout(() => d.remove(), 3200);
}
const av = (u, s = 52) => {
  const st = `width:${s}px;height:${s}px;font-size:${Math.round(s * .4)}px;`;
  if (u.avatar) return `<div class="av" style="${st}background-image:url('${u.avatar}')"></div>`;
  return `<div class="av" style="${st}background:${GR[u.grad || 0]}">${esc((u.name || u.username || "?")[0].toUpperCase())}</div>`;
};
const bannerStyle = u => u.banner ? `background-image:url('${u.banner}')` : `background:${GR[((u.grad || 0) + 3) % GR.length]}`;
const fmt = ms => new Date(ms).toLocaleTimeString("ru", { hour: "2-digit", minute: "2-digit" });

async function getUser(uid, fresh) {
  if (!fresh && cache[uid]) return cache[uid];
  try {
    const s = await getDoc(doc(db, "users", uid));
    cache[uid] = s.exists() ? { uid, ...s.data() } : { uid, name: "Удалённый", username: "deleted", bio: "" };
  } catch (e) { cache[uid] = { uid, name: "?", username: "?", bio: "" }; }
  return cache[uid];
}

/* ---------- Вход ---------- */
function setMode(m) {
  mode = m;
  $("tLogin").classList.toggle("on", m === "login");
  $("tReg").classList.toggle("on", m === "reg");
  $("nm").style.display = m === "reg" ? "block" : "none";
  $("goBtn").textContent = m === "reg" ? "Создать аккаунт" : "Войти";
  $("err").textContent = "";
}
$("tLogin").onclick = () => setMode("login");
$("tReg").onclick = () => setMode("reg");

function authError(e) {
  const c = e.code || "";
  if (c.includes("email-already-in-use")) return "Этот ник уже занят";
  if (c.includes("invalid-credential") || c.includes("user-not-found") || c.includes("wrong-password")) return "Неверный ник или пароль";
  if (c.includes("weak-password")) return "Пароль минимум 6 символов";
  if (c.includes("operation-not-allowed")) return "В Firebase не включён вход Email/Password";
  if (c.includes("unauthorized-domain")) return "Добавь домен в Authorized domains";
  if (c.includes("network")) return "Нет интернета";
  return "Ошибка: " + (e.message || c);
}

$("goBtn").onclick = async () => {
  const un = $("un").value.trim().toLowerCase(), pw = $("pw").value, nm = $("nm").value.trim();
  const err = $("err"); err.textContent = "";
  if (!/^[a-z0-9_]{3,20}$/.test(un)) { err.textContent = "Ник: 3–20 символов, латиница, цифры и _"; return; }
  if (pw.length < 6) { err.textContent = "Пароль минимум 6 символов"; return; }
  if (mode === "reg" && !nm) { err.textContent = "Введи имя"; return; }
  $("goBtn").disabled = true;
  try {
    if (mode === "reg") {
      registering = true;
      const c = await createUserWithEmailAndPassword(auth, EMAIL(un), pw);
      await setDoc(doc(db, "users", c.user.uid), {
        username: un, name: nm.slice(0, 30), bio: "", avatar: "", banner: "",
        grad: Math.floor(Math.random() * GR.length), createdAt: serverTimestamp()
      });
      registering = false;
      await enter(c.user);
    } else {
      await signInWithEmailAndPassword(auth, EMAIL(un), pw);
    }
  } catch (e) { registering = false; err.textContent = authError(e); }
  $("goBtn").disabled = false;
};
$("pw").addEventListener("keydown", e => { if (e.key === "Enter") $("goBtn").click(); });

onAuthStateChanged(auth, async u => {
  if (registering) return;
  $("splash").style.display = "none";
  if (!u) { cleanup(); $("app").style.display = "none"; $("auth").classList.add("open"); return; }
  await enter(u);
});

async function enter(u) {
  let s = await getDoc(doc(db, "users", u.uid));
  if (!s.exists()) {
    const un = (u.email || "user").split("@")[0];
    await setDoc(doc(db, "users", u.uid), { username: un, name: un, bio: "", avatar: "", banner: "", grad: 1, createdAt: serverTimestamp() });
  }
  me = await getUser(u.uid, true);
  $("auth").classList.remove("open");
  $("app").style.display = "block";
  $("un").value = ""; $("pw").value = "";
  setTab("chats"); subChats(); renderProfile();
}
function cleanup() {
  if (unsubChats) unsubChats(); if (unsubMsgs) unsubMsgs();
  unsubChats = unsubMsgs = null; cache = {}; me = null;
  document.body.classList.remove("inchat");
}

/* ---------- Вкладки ---------- */
function setTab(p) {
  ["chats", "search", "profile"].forEach(n => $("p" + n[0].toUpperCase() + n.slice(1)).classList.toggle("active", n === p));
  document.querySelectorAll(".tab").forEach(t => t.classList.toggle("on", t.dataset.p === p));
}
document.querySelectorAll(".tab").forEach(t => t.onclick = () => setTab(t.dataset.p));

/* ---------- Список чатов ---------- */
function subChats() {
  if (unsubChats) unsubChats();
  unsubChats = onSnapshot(query(collection(db, "chats"), where("members", "array-contains", me.uid)), async snap => {
    const items = snap.docs.map(d => ({ id: d.id, ...d.data({ serverTimestamps: "estimate" }) })).filter(c => c.lastText);
    items.sort((a, b) => (b.lastAt?.toMillis?.() || 0) - (a.lastAt?.toMillis?.() || 0));
    const rows = await Promise.all(items.map(async c => ({ c, u: await getUser(c.members.find(x => x !== me.uid)) })));
    const list = $("chatList");
    if (!rows.length) {
      list.innerHTML = `<div class="empty"><div>💬</div>Пока нет переписок.<br>Открой «Поиск» и найди друга по нику.</div>`;
      return;
    }
    list.innerHTML = "";
    rows.forEach(({ c, u }, i) => {
      const el = document.createElement("div");
      el.className = "row glass"; el.style.setProperty("--i", i);
      el.innerHTML = `${av(u)}<div class="info"><b>${esc(u.name)}</b><div class="last">${c.lastUid === me.uid ? "Вы: " : ""}${esc(c.lastText)}</div></div><div class="time">${c.lastAt ? fmt(c.lastAt.toMillis()) : ""}</div>`;
      el.onclick = () => openChat(u);
      list.appendChild(el);
    });
  }, e => toast("Ошибка чатов: " + e.code));
}

/* ---------- Поиск ---------- */
const hint = `<div class="empty"><div>🔍</div>Введи ник друга<br>(минимум 2 буквы)</div>`;
$("results").innerHTML = hint;
let st;
$("q").oninput = () => { clearTimeout(st); st = setTimeout(doSearch, 300); };
async function doSearch() {
  const q = $("q").value.trim().toLowerCase().replace(/^@/, "");
  const box = $("results");
  if (q.length < 2) { box.innerHTML = hint; return; }
  try {
    const snap = await getDocs(query(collection(db, "users"), where("username", ">=", q), where("username", "<=", q + "\uf8ff"), limit(15)));
    const us = snap.docs.map(d => ({ uid: d.id, ...d.data() })).filter(u => u.uid !== me.uid);
    us.forEach(u => cache[u.uid] = u);
    if (!us.length) { box.innerHTML = `<div class="empty"><div>🤷</div>Никого не нашли</div>`; return; }
    box.innerHTML = "";
    us.forEach((u, i) => {
      const el = document.createElement("div");
      el.className = "row glass"; el.style.setProperty("--i", i);
      el.innerHTML = `${av(u)}<div class="info"><b>${esc(u.name)}</b><div class="last">@${esc(u.username)}</div></div>`;
      el.onclick = () => openUserSheet(u);
      box.appendChild(el);
    });
  } catch (e) { toast("Ошибка поиска: " + e.code); }
}

/* ---------- Профили ---------- */
const profileHTML = u => `<div class="prev"><div class="banner" style="${bannerStyle(u)}"></div><div class="avwrap">${av(u, 92)}</div></div>
  <div class="pname">${esc(u.name)}</div><div class="mut" style="padding:0 6px">@${esc(u.username)}</div>
  <div class="pbio">${esc(u.bio || "Пока ничего о себе не рассказал(а)")}</div>`;

function renderProfile() {
  $("prof").innerHTML = `<div class="pcard glass">${profileHTML(me)}</div>
    <div class="row2" style="padding:0 4px"><button class="btn" id="editBtn">✏️ Редактировать</button><button class="btn red" id="outBtn">Выйти</button></div>`;
  $("editBtn").onclick = openEdit;
  $("outBtn").onclick = () => signOut(auth);
}

function openUserSheet(u) {
  const inThisChat = document.body.classList.contains("inchat") && curUser && curUser.uid === u.uid;
  $("uCard").innerHTML = `${profileHTML(u)}<div class="row2"><button class="btn ghost" id="uClose">Закрыть</button>${inThisChat ? "" : '<button class="btn" id="uWrite">💬 Написать</button>'}</div>`;
  $("uSheet").classList.add("open");
  $("uClose").onclick = () => $("uSheet").classList.remove("open");
  if (!inThisChat) $("uWrite").onclick = () => { $("uSheet").classList.remove("open"); openChat(u); };
}
$("uSheet").onclick = e => { if (e.target === $("uSheet")) $("uSheet").classList.remove("open"); };

/* ---------- Редактирование профиля ---------- */
function openEdit() {
  ed = { avatar: me.avatar || "", banner: me.banner || "", grad: me.grad || 0 };
  $("eName").value = me.name; $("eBio").value = me.bio || "";
  renderEd(); $("eSheet").classList.add("open");
}
function renderEd() {
  const t = { ...me, ...ed, name: $("eName").value || me.name };
  $("ePrev").innerHTML = `<div class="banner" style="${bannerStyle(t)}"></div><div class="avwrap">${av(t, 88)}</div>`;
  $("gr").innerHTML = GR.map((g, i) => `<i data-i="${i}" class="${i === ed.grad ? "sel" : ""}" style="background:${g}"></i>`).join("");
}
$("gr").onclick = e => { const i = e.target.dataset.i; if (i !== undefined) { ed.grad = +i; renderEd(); } };
$("pickAv").onclick = () => $("fAv").click();
$("pickBn").onclick = () => $("fBn").click();

function resize(file, w, h, q) {
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => {
      const img = new Image();
      img.onload = () => {
        const c = document.createElement("canvas"); c.width = w; c.height = h;
        const s = Math.max(w / img.width, h / img.height), dw = img.width * s, dh = img.height * s;
        c.getContext("2d").drawImage(img, (w - dw) / 2, (h - dh) / 2, dw, dh);
        res(c.toDataURL("image/jpeg", q));
      };
      img.onerror = rej; img.src = r.result;
    };
    r.onerror = rej; r.readAsDataURL(file);
  });
}
$("fAv").onchange = async e => { if (e.target.files[0]) { ed.avatar = await resize(e.target.files[0], 256, 256, .8); renderEd(); } };
$("fBn").onchange = async e => { if (e.target.files[0]) { ed.banner = await resize(e.target.files[0], 800, 320, .7); renderEd(); } };
$("eName").oninput = renderEd;
$("eCancel").onclick = () => $("eSheet").classList.remove("open");
$("eSheet").onclick = e => { if (e.target === $("eSheet")) $("eSheet").classList.remove("open"); };
$("eSave").onclick = async () => {
  const name = $("eName").value.trim();
  if (!name) { toast("Введи имя"); return; }
  const data = { name: name.slice(0, 30), bio: $("eBio").value.trim().slice(0, 150), avatar: ed.avatar, banner: ed.banner, grad: ed.grad };
  try {
    await updateDoc(doc(db, "users", me.uid), data);
    me = { ...me, ...data }; cache[me.uid] = me;
    renderProfile(); $("eSheet").classList.remove("open"); toast("Профиль сохранён ✨");
  } catch (e) { toast("Не удалось сохранить: " + e.code); }
};

/* ---------- Личный чат ---------- */
async function openChat(u) {
  curUser = u; curChat = [me.uid, u.uid].sort().join("_");
  $("chAv").innerHTML = av(u, 42); $("chName").textContent = u.name; $("chSub").textContent = "@" + u.username;
  $("msgs").innerHTML = ""; seen = new Set();
  document.body.classList.add("inchat");
  $("pChat").classList.remove("active"); void $("pChat").offsetWidth; $("pChat").classList.add("active");
  const id = curChat;
  try {
    await setDoc(doc(db, "chats", id), { members: [me.uid, u.uid] }, { merge: true });
  } catch (e) { toast("Ошибка: " + e.code); return; }
  if (id !== curChat) return;
  if (unsubMsgs) unsubMsgs();
  unsubMsgs = onSnapshot(query(collection(db, "chats", id, "messages"), orderBy("createdAt", "desc"), limit(100)), snap => {
    const box = $("msgs"); box.innerHTML = "";
    if (snap.empty) box.innerHTML = `<div class="empty"><div>👋</div>Напиши первое сообщение</div>`;
    snap.docs.slice().reverse().forEach(d => {
      const m = d.data({ serverTimestamps: "estimate" }), mine = m.uid === me.uid;
      const el = document.createElement("div");
      el.className = "m " + (mine ? "me" : "ot") + (seen.has(d.id) ? "" : " pop");
      seen.add(d.id);
      const b = document.createElement("div"); b.className = "b"; b.textContent = m.text;
      const t = document.createElement("small"); t.textContent = m.createdAt ? fmt(m.createdAt.toMillis()) : "";
      el.append(b, t); box.appendChild(el);
    });
    box.scrollTop = box.scrollHeight;
  }, e => toast("Ошибка сообщений: " + e.code));
}
$("back").onclick = () => {
  if (unsubMsgs) unsubMsgs(); unsubMsgs = null; curChat = null;
  document.body.classList.remove("inchat");
};
$("chInfo").onclick = () => curUser && openUserSheet(curUser);

async function send() {
  const t = $("mi").value.trim();
  if (!t || !curChat) return;
  $("mi").value = ""; $("mi").focus();
  try {
    await addDoc(collection(db, "chats", curChat, "messages"), { text: t.slice(0, 2000), uid: me.uid, createdAt: serverTimestamp() });
    await setDoc(doc(db, "chats", curChat), { members: [me.uid, curUser.uid], lastText: t.slice(0, 80), lastAt: serverTimestamp(), lastUid: me.uid }, { merge: true });
  } catch (e) { toast("Не отправлено: " + e.code); }
}
$("send").onclick = send;
$("mi").addEventListener("keydown", e => { if (e.key === "Enter") send(); });
</script>
