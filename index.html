<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d0d15">
<title>ClaudeMAX</title>
<style>
:root{--bg:#0d0d15;--g:rgba(255,255,255,.07);--gb:rgba(255,255,255,.14);--mut:rgba(255,255,255,.55);--acc:#d97757}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:#fff;font-family:-apple-system,"SF Pro Display",Roboto,system-ui,sans-serif;overflow:hidden}
body::before{content:"";position:fixed;inset:-20%;background:radial-gradient(circle at 20% 15%,rgba(217,119,87,.25),transparent 45%),radial-gradient(circle at 80% 85%,rgba(120,100,220,.2),transparent 45%),radial-gradient(circle at 50% 50%,rgba(60,180,200,.12),transparent 55%);z-index:-1;pointer-events:none}

.glass{background:var(--g);backdrop-filter:blur(24px) saturate(160%);-webkit-backdrop-filter:blur(24px) saturate(160%);border:1px solid var(--gb)}
.mut{color:var(--mut)}.sm{font-size:13px}.ctr{text-align:center}

.in{width:100%;padding:13px 15px;border-radius:14px;border:1px solid var(--gb);background:rgba(255,255,255,.06);color:#fff;font-size:16px;outline:none;margin-bottom:10px;font-family:inherit}
.in:focus{border-color:var(--acc);background:rgba(255,255,255,.1)}
.in::placeholder{color:rgba(255,255,255,.4)}
textarea.in{resize:none;height:80px}

.btn{border:0;border-radius:14px;padding:13px 18px;font-size:16px;font-weight:600;color:#fff;background:var(--acc);font-family:inherit;transition:opacity .15s}
.btn:active{opacity:.7}
.btn.g{background:rgba(255,255,255,.1)}
.btn.r{background:rgba(220,70,80,.3)}
.btn:disabled{opacity:.5}
.r2{display:flex;gap:8px;margin:8px 0}.r2 .btn{flex:1}

.ico{width:38px;height:38px;border:0;background:none;color:#fff;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;font-family:inherit}
.ico svg{width:22px;height:22px;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.pill{border:1.5px solid #fff;border-radius:999px;padding:5px 14px;background:none;color:#fff;font-size:12px;font-weight:600;letter-spacing:.5px;font-family:inherit;cursor:pointer}

/* Логотип */
.logo{display:inline-block;width:72px;height:72px;position:relative}
.logo svg{width:100%;height:100%;fill:var(--acc)}

/* Splash */
#splash{position:fixed;inset:0;z-index:300;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--bg);gap:16px;transition:opacity .5s}
#splash.hide{opacity:0;pointer-events:none}
#splash .logo{animation:logoIn .9s cubic-bezier(.2,.9,.3,1.3) both}
@keyframes logoIn{from{opacity:0;transform:scale(.3) rotate(-30deg)}to{opacity:1;transform:none}}
#splash h1{margin:0;font-size:36px;font-weight:800;letter-spacing:-.5px;animation:fadeUp .7s .3s both}
#splash .tip{color:var(--mut);height:18px;font-size:14px;animation:fadeUp .7s .5s both;max-width:280px;text-align:center}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

/* Auth */
#auth{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;padding:20px}
#auth.on{display:flex}
.acard{width:100%;max-width:400px;border-radius:26px;padding:28px 22px;animation:cardIn .7s cubic-bezier(.2,.9,.3,1.1) both}
@keyframes cardIn{0%{opacity:0;transform:translateY(40px) scale(.9);filter:blur(10px)}100%{opacity:1;transform:none;filter:none}}
.acard .logo{width:56px;height:56px;margin:0 auto 10px;display:block}
.acard h1{margin:0;font-size:28px;text-align:center}
.seg{display:flex;background:rgba(255,255,255,.08);border-radius:12px;padding:3px;margin:16px 0}
.seg button{flex:1;border:0;background:none;color:var(--mut);padding:10px;border-radius:9px;font-size:14px;font-weight:600;font-family:inherit}
.seg button.on{background:rgba(255,255,255,.18);color:#fff}
#err{color:#ff8a94;min-height:18px;font-size:13px;text-align:center;margin-bottom:6px}

/* Pages */
.page{position:absolute;inset:0;display:none;flex-direction:column}
.page.on{display:flex}
.tb{display:flex;align-items:center;gap:8px;padding:calc(env(safe-area-inset-top) + 14px) 16px 8px}
.tb h2{margin:0;font-size:26px;font-weight:700;flex:1}
.scroll{flex:1;overflow-y:auto;padding:6px 12px 110px}
.inchat .page:not(#pChat){display:none!important}
.inchat .tabbar{display:none}

/* Tabbar */
.tabbar{position:fixed;left:0;right:0;bottom:0;display:flex;padding:8px 8px calc(8px + env(safe-area-inset-bottom));background:rgba(13,13,21,.85);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:1px solid var(--gb);z-index:20}
.tab{flex:1;border:0;background:none;color:var(--mut);padding:8px 2px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-family:inherit;cursor:pointer}
.tab svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tab.on{color:var(--acc)}

/* Avatar */
.av{border-radius:50%;background-size:cover;background-position:center;display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff;flex-shrink:0;background-color:#333}

/* Rows */
.row{display:flex;gap:12px;align-items:center;padding:11px 12px;border-radius:16px;margin-bottom:6px;cursor:pointer;transition:background .15s}
.row:active{background:rgba(255,255,255,.08)}
.row .info{flex:1;min-width:0}
.row b{display:block;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .last{color:var(--mut);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.row .meta{color:var(--mut);font-size:11px;text-align:right;flex-shrink:0}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#30d158;margin-right:4px;vertical-align:middle}
.empty{text-align:center;color:var(--mut);padding:50px 24px;line-height:1.5}
.empty svg{width:48px;height:48px;opacity:.4;margin-bottom:10px;fill:none;stroke:currentColor;stroke-width:1.5}

/* Profile */
.pcard{border-radius:22px;padding:16px;margin-bottom:12px}
.pbanner{height:120px;border-radius:16px;margin:-16px -16px 10px;background-size:cover;background-position:center}
.pname{font-size:22px;font-weight:700;margin-top:-50px;padding-left:4px}
.pun{color:var(--mut);font-size:14px;padding-left:4px;margin-top:2px}
.pbio{margin-top:10px;line-height:1.4;font-size:14px}

/* Chat */
#pChat{z-index:30;background:var(--bg)}
#pChat.wall::after{content:"";position:absolute;inset:0;background:var(--wall);z-index:-1;opacity:.35}
.chead{display:flex;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top) + 10px) 10px 10px;background:rgba(13,13,21,.8);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid var(--gb)}
.chinfo{flex:1;min-width:0}.chinfo b{display:block;font-size:15px}.chinfo small{color:var(--mut);font-size:12px}
#msgs{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:4px}
.m{max-width:78%;display:flex;flex-direction:column}
.m.me{align-self:flex-end;align-items:flex-end}
.m .b{padding:8px 12px;border-radius:16px;font-size:15px;line-height:1.35;word-wrap:break-word;white-space:pre-wrap}
.m.me .b{background:var(--acc);border-bottom-right-radius:5px}
.m.ot .b{background:rgba(255,255,255,.12);border-bottom-left-radius:5px}
.m small{font-size:10px;color:var(--mut);margin:2px 5px 0}
.m .author{font-size:11px;color:var(--acc);margin:0 5px 2px;font-weight:600}
.m img{max-width:220px;border-radius:12px;display:block;cursor:pointer}
.m audio{height:34px;max-width:220px}
.cbar{display:flex;gap:6px;align-items:center;padding:6px 8px calc(6px + env(safe-area-inset-bottom));background:rgba(13,13,21,.85);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--gb)}
.cbar input{flex:1;background:rgba(255,255,255,.08);border:0;outline:none;color:#fff;font-size:15px;padding:10px 14px;border-radius:20px;font-family:inherit}
#send{background:var(--acc);width:40px;height:40px;border-radius:50%;border:0;color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center}
#send svg{width:20px;height:20px;fill:#fff}
.rec{color:#ff5a66!important}

/* Sheet */
.sheet{position:fixed;inset:0;z-index:50;display:none;align-items:flex-end;background:rgba(0,0,0,.5)}
.sheet.on{display:flex}
.scard{width:100%;max-height:90dvh;overflow-y:auto;border-radius:24px 24px 0 0;padding:16px 14px calc(18px + env(safe-area-inset-bottom));background:rgba(22,22,34,.95);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);animation:up .3s cubic-bezier(.2,.9,.3,1)}
@keyframes up{from{transform:translateY(100%)}}
.scard h3{margin:4px 4px 12px;font-size:20px}

/* Toast */
.toast{position:fixed;top:calc(env(safe-area-inset-top) + 14px);left:50%;transform:translateX(-50%);z-index:400;padding:10px 18px;border-radius:14px;background:rgba(40,40,55,.95);backdrop-filter:blur(14px);font-size:14px;max-width:88%;text-align:center}

/* Colors */
.gpick{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 12px}
.gpick i{width:34px;height:34px;border-radius:50%;border:3px solid transparent;cursor:pointer}
.gpick i.sel{border-color:#fff}

/* Image preview modal */
#img{position:fixed;inset:0;z-index:500;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.9);padding:20px}
#img.on{display:flex}#img img{max-width:100%;max-height:100%;border-radius:12px}
</style>
</head>

  document.body.appendChild(d);
  setTimeout(() => d.remove(), 2800);
}
function av(u, s = 48) {
  const st = `width:${s}px;height:${s}px;font-size:${Math.round(s*.4)}px;`;
  if (u.avatar) return `<div class="av" style="${st}background-image:url('${u.avatar}')"></div>`;
  const c = COLORS[u.color || 0];
  return `<div class="av" style="${st}background:${c}">${esc((u.name || u.username || "?")[0].toUpperCase())}</div>`;
}
function avEl(u, s = 48) {
  const d = document.createElement("div");
  d.className = "av"; d.style.cssText = `width:${s}px;height:${s}px;font-size:${Math.round(s*.4)}px;`;
  if (u.avatar) d.style.backgroundImage = `url('${u.avatar}')`;
  else { d.style.background = COLORS[u.color || 0]; d.textContent = (u.name || u.username || "?")[0].toUpperCase(); }
  return d;
}
function statusText(u) {
  if (!u.lastSeen) return "";
  const ms = u.lastSeen.toMillis ? u.lastSeen.toMillis() : u.lastSeen;
  const diff = Date.now() - ms;
  if (diff < 60000) return t("online");
  if (diff < 15*60000) return t("recent");
  const d = new Date(ms), now = new Date();
  const hm = d.toLocaleTimeString(lang, {hour:"2-digit",minute:"2-digit"});
  if (d.toDateString() === now.toDateString()) return `${t("seen")} ${hm}`;
  const y = new Date(now); y.setDate(y.getDate()-1);
  if (d.toDateString() === y.toDateString()) return `${t("yest")} ${hm}`;
  return d.toLocaleDateString(lang) + " " + hm;
}
async function getUser(uid, fresh) {
  if (uid === "claudbot") return {uid:"claudbot", name:"ClaudBOT", username:"claudbot", color:0, bio:"Создай своего бота"};
  if (!fresh && cache[uid]) return cache[uid];
  try {
    const s = await getDoc(doc(db,"users",uid));
    cache[uid] = s.exists() ? {uid, ...s.data()} : {uid, name:"?", username:"?"};
  } catch { cache[uid] = {uid, name:"?", username:"?"}; }
  return cache[uid];
}
function fmt(ms) { return new Date(ms).toLocaleTimeString(lang,{hour:"2-digit",minute:"2-digit"}); }

/* ===== Resize ===== */
function resize(file, w, h, q) {
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => {
      const img = new Image();
      img.onload = () => {
        const c = document.createElement("canvas"); c.width = w; c.height = h;
        const s = Math.max(w/img.width, h/img.height), dw = img.width*s, dh = img.height*s;
        c.getContext("2d").drawImage(img, (w-dw)/2, (h-dh)/2, dw, dh);
        res(c.toDataURL("image/jpeg", q));
      };
      img.onerror = rej; img.src = r.result;
    };
    r.onerror = rej; r.readAsDataURL(file);
  });
}

    const msgs = snap.docs.slice().reverse();

      const m = d.data({serverTimestamps:"estimate"});
      const mine = m.uid === me.uid;
      const el = document.createElement("div");

        const u = await getUser(m.uid);

        el.appendChild(a);

      else if (m.audio) { const a = document.createElement("audio"); a.controls = true; a.src = m.audio; b.appendChild(a); }
      else b.textContent = m.text;
      const tm = document.createElement("small"); tm.textContent = m.createdAt ? fmt(m.createdAt.toMillis()) : "";
      el.append(b, tm);
      box.appendChild(el);
    }
    box.scrollTop = box.scrollHeight;

}

  const ml = $("mList");
  c.members.forEach(async uid => {
    const u = await getUser(uid);
    const el = document.createElement("div"); el.className="row";
    el.innerHTML = `${av(u,36)}<div class="info"><b style="font-size:14px">${esc(u.name)}</b><div class="last">@${esc(u.username)}${c.admins?.includes(uid)?` · ${t("admin")}`:""}</div></div>`;
    if (isAdmin && uid !== me.uid) {
      const b = document.createElement("button"); b.className = "pill"; b.style.marginLeft="auto";
      b.textContent = c.admins?.includes(uid) ? "−" : "+" + t("admin");
      b.onclick = async e => { e.stopPropagation(); await updateDoc(doc(db,"chats",c.id), {admins: c.admins?.includes(uid) ? arrayRemove(uid) : arrayUnion(uid)}); closeSheet(); toast("✓"); };
      el.appendChild(b);
    }
    ml.appendChild(el);
  });
  if (isAdmin) {
    $("wallBtn").onclick = () => {
      openSheet(`<h3>${t("wall")}</h3><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px">${WALLS.map((w,i)=>`<div data-w="${i}" style="height:80px;border-radius:12px;background:${w};cursor:pointer"></div>`).join("")}</div>`);
      $("sheetC").onclick = async e => { const i = e.target.dataset.w; if (i!==undefined) { await updateDoc(doc(db,"chats",c.id), {wall:+i}); $("pChat").style.setProperty("--wall", WALLS[+i]); closeSheet(); } };
    };
    $("addBtn").onclick = () => {
      openSheet(`<h3>${t("addMember")}</h3><input class="in" id="aU" placeholder="username" autocapitalize="off"><div class="r2"><button class="btn g" onclick="document.getElementById('sheet').classList.remove('on')">${t("cancel")}</button><button class="btn" id="aA">${lang==="ru"?"Добавить":"Add"}</button></div>`);
      $("aA").onclick = async () => {
        const un = $("aU").value.trim().toLowerCase();
        const s = await getDoc(doc(db,"usernames",un));
        if (!s.exists()) return toast(t("none"));
        await updateDoc(doc(db,"chats",c.id), {members: arrayUnion(s.data().uid)});
        closeSheet(); toast("✓");
      };
    };
  }
}

/* ===== Отправка ===== */
async function send(extra = {}) {
  const txt = $("mi").value.trim();
  if (!txt && !extra.img && !extra.audio) return;
  $("mi").value = "";
  if (curChatData.user?.uid === "claudbot") { botHandle(txt); return; }
  try {
    const data = {uid: me.uid, createdAt: serverTimestamp()};
    if (txt) data.text = txt.slice(0, 2000);
    if (extra.img) data.img = extra.img;
    if (extra.audio) data.audio = extra.audio;
    await addDoc(collection(db,"chats",curChat,"messages"), data);
    const last = extra.img?"📷 Фото":extra.audio?"🎤 Голосовое":txt.slice(0,60);
    const upd = {lastText:last, lastAt:serverTimestamp(), lastUid:me.uid};
    if (!curChatData.isGroup) upd.members = [me.uid, curChatData.user.uid];
    await setDoc(doc(db,"chats",curChat), upd, {merge:true});
  } catch(e) { toast(e.code); }
}
$("send").onclick = () => send();
$("mi").addEventListener("keydown", e => { if (e.key === "Enter") send(); });

/* Фото */
$("attach").onclick = () => $("fPick").click();
$("fPick").onchange = async e => {
  const f = e.target.files[0]; if (!f) return;
  try { const img = await resize(f, 800, 800, .7); send({img}); } catch { toast("image error"); }
  e.target.value = "";
};

/* Голос */
let rec = null, chunks = [];
$("micBtn").onclick = async () => {
  if (rec && rec.state === "recording") { rec.stop(); return; }
  try {
    const str = await navigator.mediaDevices.getUserMedia({audio:true});
    rec = new MediaRecorder(str, {mimeType: MediaRecorder.isTypeSupported("audio/webm;codecs=opus")?"audio/webm;codecs=opus":"audio/webm"});
    chunks = [];
    rec.ondataavailable = e => chunks.push(e.data);
    rec.onstop = async () => {
      str.getTracks().forEach(t => t.stop());
      $("micBtn").classList.remove("rec");
      const blob = new Blob(chunks, {type:"audio/webm"});
      if (blob.size > 700000) { toast(lang==="ru"?"Слишком длинно":"Too long"); return; }
      const r = new FileReader();
      r.onload = () => send({audio: r.result});
      r.readAsDataURL(blob);
    };
    rec.start();
    $("micBtn").classList.add("rec");
    setTimeout(() => { if (rec.state === "recording") rec.stop(); }, 30000);
  } catch { toast(lang==="ru"?"Нет доступа к микрофону":"No mic access"); }
};

/* ===== ClaudBOT ===== */
function openBotChat() {
  const box = $("msgs"); box.innerHTML = "";
  const greet = document.createElement("div"); greet.className = "m ot";
  const b = document.createElement("div"); b.className = "b"; b.textContent = t("botHi");
  greet.appendChild(b); box.appendChild(greet);
}
async function botHandle(cmd) {
  const box = $("msgs");
  const mine = document.createElement("div"); mine.className="m me";
  const mb = document.createElement("div"); mb.className="b"; mb.textContent = cmd; mine.appendChild(mb); box.appendChild(mine);
  const reply = document.createElement("div"); reply.className="m ot";
  const rb = document.createElement("div"); rb.className="b"; reply.appendChild(rb); box.appendChild(reply);
  box.scrollTop = box.scrollHeight;

  if (cmd === "/newbot") {
    const id = "bot_" + Math.random().toString(36).slice(2,10);
    const token = id + ":" + Math.random().toString(36).slice(2,20) + Math.random().toString(36).slice(2,20);
    await setDoc(doc(db,"bots",id), {owner:me.uid, token, name:"Bot "+id.slice(4,8), createdAt:serverTimestamp()});
    rb.textContent = `${t("botCreated")}\n\n${token}\n\n${lang==="ru"?"Используй /mybots для списка":"Use /mybots to list"}`;
  } else if (cmd === "/mybots") {
    const snap = await getDocs(query(collection(db,"bots"), where("owner","==",me.uid)));
    if (snap.empty) rb.textContent = t("noBots");
    else rb.textContent = snap.docs.map(d => `• ${d.data().name} (${d.id})`).join("\n");
  } else if (cmd.startsWith("/token ")) {
    const id = cmd.slice(7).trim();
    const s = await getDoc(doc(db,"bots",id));
    if (!s.exists() || s.data().owner !== me.uid) rb.textContent = lang==="ru"?"Не найден":"Not found";
    else rb.textContent = s.data().token;
  } else {
    rb.textContent = t("botHi");
  }
  box.scrollTop = box.scrollHeight;
}

/* ===== Sheet ===== */
function openSheet(html) { $("sheetC").innerHTML = html; $("sheet").classList.add("on"); }
function closeSheet() { $("sheet").classList.remove("on"); }
$("sheet").onclick = e => { if (e.target === $("sheet")) closeSheet(); };
window.closeSheet = closeSheet;
</script>
